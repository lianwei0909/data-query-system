<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 禁止浏览器缓存页面本体，保证改动发布后刷新即生效（配合子页面的时间戳请求） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Data Query System</title>
<!-- 空 favicon：避免浏览器请求 favicon.ico 产生 404 -->
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  /* ── Aurora（暗色，默认）── */
  --bg:#0B0E14;--sidebar-bg:#0E121B;--card-bg:#12161F;--card-bg2:#171C27;
  --border:#232936;--border-light:#1B2130;
  --hover:rgba(255,255,255,.045);--hover-strong:rgba(255,255,255,.08);
  --weekend:rgba(255,255,255,.022);
  --input-border:rgba(255,255,255,.14);--input-border-hover:rgba(255,255,255,.26);
  --scrollbar:rgba(255,255,255,.12);
  --accent:#5B8CFF;--accent-glow:rgba(91,140,255,.16);--on-accent:#FFFFFF;
  --day:#5B8CFF;--night:#FFB454;--rest:#FF6B6B;--leave:#B08BFF;
  --green:#3DDC97;--green-bg:rgba(61,220,151,.14);
  --red:#FF6B6B;--red-bg:rgba(255,107,107,.14);
  --orange:#FFB454;--orange-bg:rgba(255,180,84,.14);
  --purple:#B08BFF;--purple-bg:rgba(176,139,255,.14);
  --gold:#F7C84F;--gold-bg:rgba(247,200,79,.14);
  --text-primary:#E9EDF5;--text-secondary:#94A0B8;--text-muted:#64708A;
  --radius:16px;--radius-sm:10px;
  --shadow:none;--shadow-hover:none;
  --day-bg:rgba(91,140,255,.16);--night-bg:rgba(255,180,84,.16);
  --rest-bg:rgba(255,107,107,.14);--leave-bg:rgba(176,139,255,.16);
}
:root[data-theme="paper"]{
  color-scheme:light;
  /* ── Paper（亮色）── */
  --bg:#F4F6FB;--sidebar-bg:#FFFFFF;--card-bg:#FFFFFF;--card-bg2:#F7F9FE;
  --border:#E3E8F2;--border-light:#EDF1F8;
  --hover:rgba(20,32,64,.035);--hover-strong:rgba(20,32,64,.06);
  --weekend:rgba(20,32,64,.022);
  --input-border:#DCE3F0;--input-border-hover:#C6D0E4;
  --scrollbar:rgba(20,32,64,.16);
  --accent:#3B6CF6;--accent-glow:rgba(59,108,246,.12);--on-accent:#FFFFFF;
  --day:#3B6CF6;--night:#E8892B;--rest:#E5484D;--leave:#8B5CF6;
  --green:#12A171;--green-bg:rgba(18,161,113,.12);
  --red:#E5484D;--red-bg:rgba(229,72,77,.10);
  --orange:#E8892B;--orange-bg:rgba(232,137,43,.12);
  --purple:#8B5CF6;--purple-bg:rgba(139,92,246,.10);
  --gold:#B8860B;--gold-bg:rgba(184,134,11,.12);
  --text-primary:#16203A;--text-secondary:#5B6779;--text-muted:#8792A6;
  --shadow:0 4px 16px rgba(20,32,64,.06);
  --shadow-hover:0 6px 22px rgba(20,32,64,.10);
  --day-bg:rgba(59,108,246,.10);--night-bg:rgba(232,137,43,.12);
  --rest-bg:rgba(229,72,77,.10);--leave-bg:rgba(139,92,246,.10);
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;overflow-x:hidden!important;overflow-y:hidden!important;min-width:0!important}

/* SIDEBAR */
.sidebar{width:270px;min-width:270px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:10}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column}
.logo-title{font-size:16px;font-weight:600;color:var(--text-primary);line-height:1.2}
.logo-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.sidebar-section{padding:18px 14px 10px}
.sidebar-section-label{font-size:13px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;margin-bottom:3px;position:relative;text-decoration:none;color:var(--text-secondary)}
.nav-item:hover{background:var(--hover);color:var(--text-primary)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.nav-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.nav-icon.green{background:var(--green-bg)}.nav-icon.red{background:var(--red-bg)}.nav-icon.purple{background:var(--purple-bg)}.nav-icon.gold{background:var(--gold-bg)}.nav-icon.blue{background:var(--accent-glow)}.nav-icon.orange{background:var(--orange-bg)}
.nav-label{font-size:16px;font-weight:500;flex:1}
.sidebar-divider{height:1px;background:var(--border);margin:8px 16px}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border)}
/* 顶栏右侧：主题切换 */
.theme-toggle{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card-bg2);color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-left:10px}
.theme-toggle:hover{color:var(--text-primary);border-color:var(--input-border-hover);background:var(--hover)}
.theme-toggle svg{width:16px;height:16px}
:root[data-theme="paper"] .theme-toggle .ic-moon{display:none}
:root:not([data-theme="paper"]) .theme-toggle .ic-sun{display:none}

/* 本月概览（右栏） */
.overview-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);flex:0 0 auto}
.ov-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.ov-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.ov-period{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.ov-row{display:flex;align-items:center;gap:10px;height:26px}
.ov-label{width:34px;font-size:12.5px;color:var(--text-secondary);flex-shrink:0}
.ov-bar{flex:1;height:8px;border-radius:4px;background:var(--card-bg2);overflow:hidden}
.ov-fill{height:100%;border-radius:4px;transition:width .3s ease}
.ov-val{width:44px;text-align:right;font-size:12.5px;color:var(--text-primary);flex-shrink:0;font-variant-numeric:tabular-nums}

/* 顶栏右侧：查看谁的班表 */
.topbar-who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.topbar-who .who-label{font-size:13px;color:var(--text-secondary);white-space:nowrap}
.who-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.who-avatar.miss{background:rgba(247,95,95,.25);color:#fca5a5}
.who-input{width:220px;background:var(--card-bg2);color:var(--text-primary);border:1px solid var(--input-border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.who-input:hover{border-color:var(--input-border-hover)}
.who-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.who-input::placeholder{color:var(--text-muted)}
.who-clear{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0}
.who-clear:hover{color:var(--text-primary);border-color:var(--input-border-hover)}
.who-status{font-size:12px;color:var(--text-muted);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-status:empty{display:none}
.who-status.ok{color:#6ee7b7}
.who-status.warn{color:#f7c84f}
.who-status.err{color:#fca5a5}
.user-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.user-card:hover{background:var(--hover)}
.user-avatar-sm{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-info-sm{flex:1;min-width:0}
.user-name-sm{font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role-sm{font-size:12px;color:var(--text-muted)}

/* MAIN */
.main{margin-left:270px;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;overflow-x:hidden}
.topbar{height:56px;min-height:56px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:12px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);flex:1}
.breadcrumb-item.current{color:var(--text-primary);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:8px}
.topbar-user{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius-sm);cursor:default;border:1px solid var(--border);transition:all .15s}
.page-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 32px}

/* ═══════════ 子页面统一样式 ═══════════ */
.sub-page-body .container{width:auto!important;min-width:auto!important;max-width:none!important;margin:0;padding:0}
.sub-page-body{
  animation:fadeInUp .4s ease-out both;
  color:var(--text-primary);font-family:inherit;
  max-width:1600px;margin:0 auto;padding:0;
  text-align:center
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* 子页面标题 */
.sub-page-body h2{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:6px;display:flex;align-items:center;gap:10px;justify-content:center}
.sub-page-body h2::before{content:'';width:4px;height:22px;border-radius:2px;background:linear-gradient(180deg,var(--accent),#818cf8);flex-shrink:0}
.sub-page-body p{color:var(--text-secondary);font-size:14px;margin-bottom:4px}

/* 上传区域 */
.sub-page-body .upload-section{
  background:var(--card-bg);
  border:2px dashed var(--border);
  border-radius:16px;
  padding:48px 30px;
  text-align:center;
  margin-bottom:28px;
  transition:all .3s ease;
  cursor:pointer;
  position:relative;
  overflow:hidden
}
.sub-page-body .upload-section:hover{
  border-color:rgba(102,126,234,.5);
  background:rgba(102,126,234,.04)
}
.sub-page-body .upload-section.drag-over{
  border-color:var(--accent)!important;
  border-style:solid!important;
  background:rgba(102,126,234,.1)!important;
  box-shadow:0 0 60px rgba(102,126,234,.15)
}
.sub-page-body .drag-hint svg{transition:transform .3s ease;margin:12px auto;display:block;opacity:.6}
.sub-page-body .upload-section.drag-over .drag-hint svg{transform:translateY(-6px) scale(1.08)}

/* 文件选择 */
.sub-page-body .file-input-wrapper{display:inline-block;margin-top:14px}
.sub-page-body .file-input{position:absolute;width:0;height:0;opacity:0}
.sub-page-body .file-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 28px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,.03);
  color:var(--text-secondary);
  font-size:14px;
  cursor:pointer;
  transition:all .25s ease
}
.sub-page-body .file-label:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(102,126,234,.08)
}

/* 预览区域 */
.sub-page-body .preview-section{
  display:none;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:28px
}
.sub-page-body .preview-section.active{display:block}

/* 统计卡片（子页面） */
.sub-page-body .stats-row{display:flex;gap:16px;margin-bottom:20px}
.sub-page-body .stat-card{
  flex:1;background:rgba(102,126,234,.06);
  border:1px solid rgba(102,126,234,.12);
  border-radius:12px;padding:18px;text-align:center
}
.sub-page-body .stat-number{font-size:28px;font-weight:700;color:var(--text-primary)}
.sub-page-body .stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px}

/* 表格 */
.sub-page-body .table-wrapper{overflow-x:auto;border-radius:12px;border:1px solid var(--border);margin-bottom:20px}
.sub-page-body table{width:100%;border-collapse:collapse;font-size:13px}
.sub-page-body th{
  background:rgba(102,126,234,.08);
  padding:11px 14px;
  text-align:center;font-weight:600;
  color:var(--text-secondary);
  border-bottom:1px solid var(--border);
  white-space:nowrap;font-size:13px;text-transform:uppercase;letter-spacing:.5px
}
.sub-page-body td{
  padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);
  color:var(--text-primary);
  text-align:center;font-size:13px
}
.sub-page-body tr:hover td{background:var(--hover)}

/* 按钮组 */
.sub-page-body .btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sub-page-body .btn{
  padding:10px 32px;
  border:none;border-radius:10px;
  font-size:14px;font-weight:600;
  cursor:pointer;transition:all .25s ease;
  display:inline-flex;align-items:center;gap:6px
}
.sub-page-body .btn-primary{
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:#fff;
  box-shadow:0 4px 20px rgba(79,70,229,.35)
}
.sub-page-body .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(79,70,229,.5)}
.sub-page-body .btn-secondary{
  background:rgba(255,255,255,.06);
  color:var(--text-secondary);
  border:1px solid var(--border)
}
.sub-page-body .btn-secondary:hover{background:rgba(255,255,255,.1);color:var(--text-primary)}

/* 分页控件 */
.sub-page-body .pagination-controls{text-align:center;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.sub-page-body .page-btn{
  padding:7px 16px;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  color:var(--text-secondary);font-size:13px;
  cursor:pointer;transition:all .2s
}
.sub-page-body .page-btn:hover:not(:disabled){
  background:rgba(102,126,234,.1);
  border-color:var(--accent);color:var(--accent)
}
.sub-page-body .page-btn:disabled{opacity:.35;cursor:not-allowed}
.sub-page-body .page-info{color:var(--text-muted);font-size:13px}

/* 提示文字 */
.sub-page-body .hint-text{color:var(--text-muted);font-size:13px;margin-top:8px}
.sub-page-body .format-hint{color:var(--text-muted);font-size:12px;margin-top:10px}

/* ── 数据导入模块专用样式（与过审/不过审模块风格完全统一）── */
.sub-page-body .page-intro{text-align:center;margin-bottom:20px}
.sub-page-body .page-intro h2{justify-content:center;margin-bottom:8px}
.sub-page-body .page-intro p{color:var(--text-secondary);font-size:14px}

/* 上传卡片：包含标题区域，一个完整卡片 */
.sub-page-body .upload-section{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px;
  margin-bottom:20px;
  text-align:center;
  transition:border-color .3s ease
}
.sub-page-body .upload-section:hover{
  border-color:rgba(102,126,234,.35)
}

/* 上传箭头图标（和不过审模块一致） */
.sub-page-body .upload-arrow-icon{margin-bottom:16px;display:flex;justify-content:center}
.sub-page-body .upload-section:hover{
  border-color:rgba(102,126,234,.35)
}

/* 内部上传区域：去掉大虚线框，改为简洁的箭头图标+按钮风格 */
.sub-page-body .upload-zone{
  border:none;
  padding:0;
  text-align:center;cursor:pointer;
  transition:all .3s ease;position:relative
}
.sub-page-body .upload-zone:hover,
.sub-page-body .upload-zone.drag-over{
  background:transparent
}
/* 上传箭头图标 */
.sub-page-body .upload-icon{font-size:3em;margin-bottom:16px;opacity:.45;display:block;line-height:1}
.sub-page-body .upload-text{font-size:14px;color:var(--text-secondary);margin-bottom:6px}
.sub-page-body .upload-hint{font-size:13px;color:var(--text-muted)}
.sub-page-body .upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* 选择文件按钮：胶囊形，和不过审模块一致 */
.sub-page-body .file-input-wrapper{display:inline-block;margin-top:18px}
.sub-page-body .file-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 28px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,.04);
  color:var(--text-secondary);
  font-size:14px;
  cursor:pointer;
  transition:all .25s ease
}
.sub-page-body .file-label:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(102,126,234,.08)
}

.sub-page-body .table-section{
  display:none;background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;padding:24px;
  overflow-x:auto;margin-bottom:20px
}
.sub-page-body .table-section.visible,
.sub-page-body .table-section[style*="block"]{display:block!important}
.sub-page-body .section-title{font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:18px;display:flex;align-items:center;gap:10px;justify-content:center}
.sub-page-body .section-title .count{
  background:rgba(102,126,234,.1);color:var(--accent);
  font-size:12px;padding:3px 12px;border-radius:20px;font-weight:600
}
.sub-page-body .action-bar{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sub-page-body .btn-import{
  padding:10px 36px;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease;
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:#fff;box-shadow:0 4px 20px rgba(79,70,229,.35)
}
.sub-page-body .btn-import:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(79,70,229,.5)}

/* 通知条 */
.sub-page-body .notification{
  position:fixed;top:28px;right:28px;padding:14px 26px;
  border-radius:12px;font-size:14px;font-weight:600;z-index:10000;
  transform:translateX(120%);transition:transform .35s cubic-bezier(.16,1,.3,1);
  backdrop-filter:blur(16px)
}
.sub-page-body .notification.show{transform:translateX(0)}
.sub-page-body .notification.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.sub-page-body .notification.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.stat-card:hover{border-color:var(--input-border);box-shadow:var(--shadow-hover)}
.stat-icon{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-icon.blue{background:var(--accent-glow)}.stat-icon.green{background:var(--green-bg)}.stat-icon.orange{background:var(--orange-bg)}.stat-icon.purple{background:var(--purple-bg)}
.stat-combo{color:var(--text-secondary);min-width:0}
.stat-value{display:flex;align-items:baseline;gap:4px;line-height:1.1}
.stat-combo .num{color:var(--text-primary);font-weight:700;font-size:28px;letter-spacing:-.01em}
.stat-combo .unit{font-size:14px;color:var(--text-secondary);font-weight:500}
.stat-combo .num.special{font-size:20px;line-height:1.3;white-space:normal}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* CONTENT GRID */
#page-calendar{display:flex;flex-direction:column;min-height:100%}
#page-calendar .stats-row{flex:0 0 auto}
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);gap:16px;align-items:stretch;flex:1 1 auto;min-height:560px}
.side-col{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.side-col .detail-card{flex:1 1 42%;min-height:0;overflow-y:auto}
.side-col .board-panel:not(.collapsed){flex:1 1 55%;min-height:300px}
.side-col .board-panel.collapsed{flex:0 0 auto}

/* 左侧空白画板 */
.canvas-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.board-modes{display:flex;gap:6px}
.board-mode-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.board-mode-btn:hover{color:var(--text-primary)}
.board-mode-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.board-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.board-tools.hidden{display:none}
.board-eraser{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.board-eraser:hover{color:var(--text-primary);border-color:var(--text-muted)}
.board-eraser.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.board-color-picker{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border:1px solid var(--border);border-radius:8px;transition:all .15s}
.board-color-picker:hover{border-color:var(--text-muted)}
.board-color-picker input[type=color]{position:absolute;width:0;height:0;opacity:0;pointer-events:none;border:none;padding:0}
.board-color-swatch{width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset;border:1px solid rgba(0,0,0,.3)}
.board-color-label{font-size:13px;color:var(--text-secondary)}
.board-size{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12px}
.board-size input[type=range]{width:90px;accent-color:var(--accent);cursor:pointer}
.draw-tools{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.text-tools{display:flex;align-items:center;gap:12px}
.board-img{position:absolute;z-index:6;cursor:grab;border:1px solid transparent;border-radius:6px;line-height:0}
.board-img:hover{border-color:rgba(255,255,255,.4)}
.board-img.del-mode{cursor:default}
.board-img img{display:block;width:100%;height:auto;border-radius:6px;pointer-events:none}
.board-img-resize{position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.6);background:var(--accent);cursor:nwse-resize;display:none;z-index:7}
.board-img:hover .board-img-resize{display:block}
.board-img-del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer;padding:0;display:none;z-index:7}
.board-img:hover .board-img-del{display:block}
.board-clear{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.board-clear:hover{color:var(--red);border-color:var(--red)}
.board-stage{flex:1;position:relative;min-height:0}
.board-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .15s}
.board-head:hover{background:var(--hover)}
.board-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.board-panel.collapsed .board-head{border-bottom:none}
.board-head-icon{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--gold-bg);flex-shrink:0}
.board-head-title{font-size:14px;font-weight:600;color:var(--text-primary);flex-shrink:0}
.board-head-preview{flex:1;min-width:0;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-head-toggle{font-size:12px;color:var(--accent);flex-shrink:0;display:flex;align-items:center;gap:4px}
.board-head-toggle svg{transition:transform .2s}
.board-panel:not(.collapsed) .board-head-toggle svg{transform:rotate(180deg)}
.board-panel.collapsed .board-toolbar,.board-panel.collapsed .board-stage{display:none}
.side-col .board-toolbar{padding:8px 10px;gap:8px}
.side-col .board-tools,.side-col .draw-tools{gap:8px}
.side-col .board-color-label{display:none}
.side-col .board-size input[type=range]{width:70px}
.side-col .board-hint{width:80%;text-align:center;font-size:13px;line-height:1.6}
#board-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;display:block}
#board-memo{position:absolute;inset:0;width:100%;height:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text-primary);font-size:14px;line-height:1.7;padding:16px 18px;font-family:inherit;display:none}
#board-memo::placeholder{color:var(--text-muted)}
.board-panel.text #board-canvas{display:none}
.board-panel.text #board-memo{display:block}
.board-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text-muted);font-size:14px;pointer-events:none}
.board-cursor{position:absolute;pointer-events:none;border:2px solid rgba(255,255,255,.95);border-radius:50%;transform:translate(-50%,-50%);display:none;z-index:5;box-shadow:0 0 0 1px rgba(0,0,0,.4);mix-blend-mode:difference}

/* CALENDAR CARD */
.calendar-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:20px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.card-title-sub{font-size:14px;color:var(--text-secondary);font-weight:400}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav-btn{width:28px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px;transition:all .15s}
.cal-nav-btn:hover{background:var(--hover-strong);color:var(--text-primary);border-color:var(--input-border)}
.cal-legend{display:flex;gap:20px;margin-bottom:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);line-height:1}
.legend-dot{width:8px;height:8px;border-radius:2px}
.legend-dot.blue{background:var(--accent)}.legend-dot.orange{background:var(--orange)}.legend-dot.red{background:var(--red)}.legend-dot.purple{background:var(--purple)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(42px,1fr);gap:3px;flex:1;min-height:0}
.cal-head{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text-muted);padding:4px 0 1px;margin-top:5px}
.cal-head.weekend{color:rgba(247,95,95,.7)}
.cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;cursor:default;padding:4px 3px;transition:background .12s;position:relative;gap:3px;min-height:42px}
.cal-cell.clickable{cursor:pointer}
.cal-cell:hover:not(.empty):not(.other-month){background:var(--hover)}
.cal-cell.weekend-col{background:var(--weekend)}
.cal-cell.today{background:transparent}
.cal-cell.empty{cursor:default}
.cal-cell.selected{outline:2px solid var(--accent);outline-offset:-2px}
.cal-date{font-size:16px;font-weight:500;color:var(--text-primary);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;line-height:1}
.cal-cell.today .cal-date{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-weight:700;box-shadow:0 0 6px rgba(79,142,247,.45)}
.cal-cell.other-month .cal-date{color:var(--text-muted)}
/* 日历班次：短标签（白 / 夜 / 休 / 假）+ 格子底部色条；悬停显示完整班次名 */
.cal-shift{font-size:13px;font-weight:700;line-height:1;padding:3px 7px;border-radius:5px;white-space:nowrap}
.cal-shift.s-day{background:var(--day-bg);color:var(--day)}
.cal-shift.s-night{background:var(--night-bg);color:var(--night)}
.cal-shift.s-rest{background:var(--rest-bg);color:var(--rest)}
.cal-shift.s-leave{background:var(--leave-bg);color:var(--leave)}
.cal-shift.s-none{background:transparent;color:var(--text-muted);font-weight:500;font-size:12px;padding:3px 2px}
.cal-cell[data-s]::after{content:'';position:absolute;left:22%;right:22%;bottom:4px;height:3px;border-radius:2px;opacity:.75}
.cal-cell[data-s="day"]::after{background:var(--day)}
.cal-cell[data-s="night"]::after{background:var(--night)}
.cal-cell[data-s="rest"]::after{background:var(--rest)}
.cal-cell[data-s="leave"]::after{background:var(--leave)}
/* 月份标题旁的引导：本月后面几天还没排班 / 没导入班表 */
.cal-hint{font-size:12px;color:var(--gold);background:var(--gold-bg);border:1px solid rgba(247,200,79,.25);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-weight:500}
.cal-hint:hover{border-color:rgba(247,200,79,.6)}
.cal-hint:empty{display:none}

/* DETAIL CARD */
.detail-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.detail-date{font-size:13px;color:var(--text-secondary);margin-top:2px;font-weight:400}
.attendance-count{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent-glow);border:1px solid rgba(79,142,247,.2);border-radius:var(--radius-sm)}
.attendance-count-num{font-size:28px;font-weight:800;color:var(--accent);line-height:1}
.attendance-count-label{font-size:14px;color:var(--text-primary);font-weight:600}
.attendance-mini-stats{display:flex;gap:8px;font-size:12px;color:var(--text-secondary)}
.mini-stat-dot{width:5px;height:5px;border-radius:50%}
.mini-stat-dot.blue{background:var(--accent)}.mini-stat-dot.night{background:var(--orange)}
.shift-section{display:flex;flex-direction:column;gap:8px}
.shift-section-header{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.shift-indicator{width:3px;height:14px;border-radius:2px;flex-shrink:0}
.shift-indicator.day{background:var(--accent)}.shift-indicator.night{background:var(--orange)}
.shift-section-title{font-size:14px;font-weight:600;color:var(--text-secondary);flex:1}
.shift-count-badge{font-size:12px;padding:1px 6px;border-radius:20px;font-weight:600}
.shift-count-badge.day{background:var(--accent-glow);color:var(--accent)}
.shift-count-badge.night{background:var(--orange-bg);color:var(--orange)}
.staff-list{display:flex;flex-direction:column;gap:6px}
.staff-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card-bg2);border-radius:var(--radius-sm);border:1px solid var(--border-light);transition:border-color .12s}
.staff-item:hover{border-color:var(--border)}
.staff-item.me{border-color:rgba(79,142,247,.55);background:rgba(79,142,247,.08)}
.staff-tags{display:flex;align-items:center;gap:6px;flex-shrink:0}
.staff-duty{font-size:12px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--gold-bg);color:var(--gold);white-space:nowrap}
.staff-me{font-size:12px;color:var(--accent);margin-left:6px;font-weight:500}
.staff-empty{font-size:12px;color:var(--text-muted);padding:6px 2px}
.duty-miss{font-size:12px;color:var(--gold);line-height:1.5}
.duty-miss:empty{display:none}
.staff-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.staff-avatar.blue{background:linear-gradient(135deg,#4f8ef7,#6fa3f8)}
.staff-avatar.green{background:linear-gradient(135deg,#2dd4a0,#3de8b0)}
.staff-avatar.purple{background:linear-gradient(135deg,#a07ff7,#b89bff)}
.staff-avatar.orange{background:linear-gradient(135deg,#f7a24f,#f7bc7a)}
.staff-avatar.pink{background:linear-gradient(135deg,#f75f9a,#f77bb5)}
.staff-avatar.cyan{background:linear-gradient(135deg,#22d3ee,#67e8f9)}
.staff-avatar.gold{background:linear-gradient(135deg,#facc15,#fde047)}
.staff-avatar.rose{background:linear-gradient(135deg,#fb7185,#fda4af)}
.staff-avatar.teal{background:linear-gradient(135deg,#14b8a6,#5eead4)}
.staff-avatar.indigo{background:linear-gradient(135deg,#818cf8,#a5b4fc)}
.staff-name{font-size:14px;font-weight:500;color:var(--text-primary);flex:1}
.staff-dept{font-size:12px;color:var(--text-muted)}
.staff-shift-tag{font-size:12px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.staff-shift-tag.day{background:var(--day-bg);color:var(--day)}
.staff-shift-tag.night{background:var(--night-bg);color:var(--night)}
.divider{height:1px;background:var(--border)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--input-border-hover)}

/* ====== 通知 ====== */
.notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:10000;transition:transform .3s cubic-bezier(.16,1,.3,1);max-width:90vw;white-space:pre-wrap}
.notification.show{transform:translateX(-50%) translateY(0)}
.notification.success{background:rgba(45,212,160,.18);border:1px solid rgba(45,212,160,.5);color:#6ee7b7}
.notification.error{background:rgba(247,95,95,.18);border:1px solid rgba(247,95,95,.5);color:#fca5a5}
.notification.info{background:rgba(79,142,247,.18);border:1px solid rgba(79,142,247,.5);color:#93c5fd}


/* 子页面：首次加载占位与切换淡入（避免「空白 → 出现」的闪烁） */
.sub-loading{text-align:center;padding:60px;color:var(--text-muted);font-size:14px}
.sub-loading.error{color:#ef4444}
.sub-page-body{animation:subFade .18s ease-out both}
@keyframes subFade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#page-sub.is-loading{opacity:.55;transition:opacity .12s}

/* ── 响应式 ── */
/* 中等屏：侧边栏收成图标栏，右侧栏略窄 */
@media (max-width:1439px){
  .sidebar{width:72px;min-width:72px}
  .main{margin-left:72px}
  .sidebar-logo{justify-content:center;padding:18px 8px}
  .logo-text,.nav-label,.sidebar-section-label{display:none}
  .sidebar-section{padding:12px 10px 6px}
  .nav-item{justify-content:center;padding:10px 0}
  .nav-icon{width:34px;height:34px}
  .who-input{width:170px}
  .content-grid{grid-template-columns:minmax(0,1fr) 330px}
}
/* 平板：日历独占一行，右侧栏移到下面 */
@media (max-width:1023px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;min-height:0}
  .side-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .side-col .detail-card,.side-col .board-panel:not(.collapsed){max-height:520px;min-height:0}
  .page-content{padding:20px}
  .who-status{max-width:200px}
}
/* 手机：导航改成底部图标栏，单列 */
@media (max-width:767px){
  body{overflow:auto!important}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;min-width:0;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);z-index:60;padding:0}
  .sidebar-logo{display:none}
  .sidebar-section{display:contents}
  .sidebar-section-label,.sidebar-divider{display:none}
  .nav-item{flex:1;flex-direction:column;gap:3px;padding:7px 4px;margin:0;border-radius:0}
  .nav-icon{width:28px;height:28px}
  .nav-label{display:block;font-size:11px;flex:none;text-align:center}
  .main{margin-left:0;height:auto;min-height:100vh;padding-bottom:62px;overflow:visible}
  .topbar{height:auto;min-height:52px;padding:8px 14px;flex-wrap:wrap;gap:8px}
  .page-content{padding:14px}
  .topbar-who{width:100%;margin-left:0}
  .who-input{flex:1;width:auto}
  .who-status{max-width:none}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:12px;gap:10px}
  .stat-icon{width:38px;height:38px}
  .stat-combo .num{font-size:22px}
  .content-grid{grid-template-columns:minmax(0,1fr);min-height:0;gap:12px}
  .side-col{grid-template-columns:minmax(0,1fr)}
  .calendar-card{padding:10px}
  .cal-head{font-size:12px}
  .cal-date{width:22px;height:22px;font-size:14px}
  .cal-shift{font-size:12px;padding:2px 6px}
  .cal-cell{min-height:38px;padding:3px 2px}
  .board-head-preview{display:none}
}

<script>
"use strict";

// ═══════════════════════════════════════
// 固定账号（登录功能已移除，换账号改这里）
// ═══════════════════════════════════════
var DEFAULT_USER = 'anweili';
try { sessionStorage.removeItem('currentUser'); } catch(e) {}

// ═══════════════════════════════════════
// SPA 页面导航
// ═══════════════════════════════════════
var currentPage = sessionStorage.getItem('currentPage') || 'calendar';
var PAGE_MAP = {
    'calendar': { title: '排班日历', group: '工作台', file: null },
    'approve':  { title: '过审模块',   group: '功能', file: 'converter-approve.html' },
    'reject':   { title: '不过审模块',  group: '功能', file: 'converter-reject.html' },
    'import':   { title: '数据导入',   group: '功能', file: 'converter-import.html' },
    'scheduler':{ title: '智能排班',   group: '功能', file: 'scheduler.html' }
};

// 子页面版本号：发版时改这里，浏览器缓存自动失效（原来每次都用 Date.now() 绕缓存，等于永不缓存）
var SITE_VER = 'v10';
var pageCache = {};          // 会话内 HTML 缓存：来回切换不再重复请求
var XLSX_URL = './xlsx.full.min.js';
var xlsxPromise = null;

// Excel 解析库按需加载（约 860KB，只有真正用到 Excel 的页面才下载）
function loadXlsx(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxPromise) return xlsxPromise;
    xlsxPromise = new Promise(function(resolve, reject){
        var s = document.createElement('script');
        s.src = XLSX_URL + '?v=' + SITE_VER;
        s.onload = function(){
            if (window.XLSX) resolve(window.XLSX);
            else { xlsxPromise = null; reject(new Error('Excel 解析库未就绪')); }
        };
        s.onerror = function(){ xlsxPromise = null; reject(new Error('Excel 解析库加载失败')); };
        document.head.appendChild(s);
    });
    return xlsxPromise;
}
window.loadXlsx = loadXlsx;

function fetchPage(file){
    if (pageCache[file]) return Promise.resolve(pageCache[file]);
    return fetch(file + '?v=' + SITE_VER).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
    }).then(function(html){
        pageCache[file] = html;
        return html;
    });
}

// 已下线的页面（如音乐模块）不再恢复，回到日历
if (!PAGE_MAP[currentPage]) { currentPage = 'calendar'; try { sessionStorage.setItem('currentPage', 'calendar'); } catch(e) {} }

function navigateTo(page) {
    if (page === currentPage && page === 'calendar') return;
    var cfg = PAGE_MAP[page];
    if (!cfg) return;
    // 保存当前页面状态，刷新后可恢复
    sessionStorage.setItem('currentPage', page);

    // 更新侧边栏 active 状态
    document.querySelectorAll('.nav-item').forEach(function(el){
        el.classList.toggle('active', el.getAttribute('data-page') === page);
    });

    // 更新面包屑：工作台 > 排班日历  或  功能 > 过审模块
    var bc = document.querySelector('.breadcrumb');
    if (bc) {
        bc.innerHTML = '<span class="breadcrumb-item">' + cfg.group + '</span><span>›</span><span class="breadcrumb-item current">' + cfg.title + '</span>';
    }

    var calEl = document.getElementById('page-calendar');
    var subEl = document.getElementById('page-sub');
    var whoBox = document.getElementById('who-box');
    if (whoBox) whoBox.style.display = (page === 'calendar') ? '' : 'none';

    if (page === 'calendar') {
        // 显示日历页面（一次性同步渲染，不再用定时器拼接）
        calEl.style.display = '';
        subEl.style.display = 'none';
        subEl.innerHTML = '';
        currentPage = 'calendar';
        renderHome();
        return;
    }

    // 加载子页面
    calEl.style.display = 'none';
    subEl.style.display = '';
    currentPage = page;
    // 已有内容时不显示「加载中」，避免来回切换闪烁；首次加载才显示占位
    if (!subEl.querySelector('.sub-page-body')) {
        subEl.innerHTML = '<div class="sub-loading">加载中…</div>';
    } else {
        subEl.classList.add('is-loading');
    }

    // Excel 库在后台并行下载，不阻塞页面打开（子页面只在上传 / 导出时才真正用到它）
    loadXlsx().catch(function(){ /* 加载失败也不影响页面打开，用到 Excel 时再由子页面提示 */ });
    // 页面 HTML 走会话缓存 + 固定版本号
    fetchPage(cfg.file)
        .then(function(html){
            // 提取 body 内容（去掉 html/head）
            var bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
            var content = bodyMatch ? bodyMatch[1] : html;

            // 创建临时容器解析 HTML
            var tmp = document.createElement('div');
            tmp.innerHTML = content;

            // 移除子页面自带的导航元素
            var removeSelectors = ['.module-nav', '.btn-back', '.sidebar', 'aside'];
            removeSelectors.forEach(function(sel){
                tmp.querySelectorAll(sel).forEach(function(el){ el.remove(); });
            });

            // 将子页面的 container 内容注入
            var container = tmp.querySelector('.container');
            if (container) {
                // 先在离屏容器里拼好，最后一次替换，避免「清空 → 空白 → 重新出现」的闪烁
                var frag = document.createDocumentFragment();
                var styles = tmp.querySelectorAll('style, link[rel="stylesheet"]');
                styles.forEach(function(s){
                    if (s.tagName === 'STYLE') {
                        // 去掉子页面中的 html{} 和 body{} 全局规则，
                        // 否则 min-width:1400px + overflow-x:auto 会覆盖主框架的 overflow-x:hidden，
                        // 导致切换子页面时右侧出现白边
                        var css = s.textContent;
                        // 只过滤子页面的主 <style>（跳过 omega 编辑层的 style，它不需要注入）
                        if (css.indexOf('data-omega-edit-layer') >= 0 || css.indexOf('omega-edit') >= 0) return;
                        css = css.replace(/html\s*\{[^}]*\}/g, '');
                        css = css.replace(/body\s*\{[^}]*\}/g, '');
                        // 同时去掉 .bg-overlay 的全局定位（fixed 定位在嵌入模式下会错位）
                        css = css.replace(/\.bg-overlay\s*\{[^}]*\}/g, '');
                        var cleanStyle = document.createElement('style');
                        cleanStyle.setAttribute('data-sub-injected', '1');
                        cleanStyle.textContent = css;
                        frag.appendChild(cleanStyle);
                    } else {
                        var clonedLink = s.cloneNode(true);
                        clonedLink.setAttribute('data-sub-injected', '1');
                        frag.appendChild(clonedLink);
                    }
                });

                var subDiv = document.createElement('div');
                subDiv.className = 'sub-page-body';
                subDiv.appendChild(container);
                frag.appendChild(subDiv);

                // ── 数据导入页面特殊处理：把标题移进卡片，加箭头+按钮 ──
                if (page === 'import') {
                    var intro = subDiv.querySelector('.page-intro');
                    var uploadSec = subDiv.querySelector('.upload-section');
                    var uploadZone = subDiv.querySelector('.upload-zone');
                    if (intro && uploadSec) {
                        // 标题+副标题 移到卡片最前面
                        uploadSec.insertBefore(intro, uploadSec.firstChild);
                    }
                    if (uploadZone) {
                        // 确保子页面脚本能通过 getElementById 找到这些元素
                        if (!uploadZone.id) uploadZone.id = 'upload-zone';
                        // 加上传箭头图标（和不过审模块一致）
                        var arrowIcon = document.createElement('div');
                        arrowIcon.className = 'upload-arrow-icon';
                        arrowIcon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(102,126,234,.5)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
                        // 清空原内容，换成箭头+按钮布局
                        var oldHtml = uploadZone.innerHTML;
                        uploadZone.innerHTML = '';
                        uploadZone.appendChild(arrowIcon);
                        // 选择文件按钮
                        var btnWrap = document.createElement('div');
                        btnWrap.className = 'file-input-wrapper';
                        var fileLabel = document.createElement('label');
                        fileLabel.className = 'file-label';
                        fileLabel.innerHTML = '<span>📂</span> <span>选择文件（CSV / Excel）</span>';
                        var fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.id = 'file-input';
                        fileInput.className = 'file-input';
                        fileInput.accept = '.csv,.xlsx,.xls,.txt';
                        // 保留原有 input 的事件绑定
                        var origInput = oldHtml.match(/<input[^>]*type=["']file["'][^>]*>/);
                        if (origInput) {
                            var tmp2 = document.createElement('div');
                            tmp2.innerHTML = origInput[0];
                            var oi = tmp2.querySelector('input');
                            if (oi && oi.onclick) fileInput.onclick = oi.onclick;
                            if (oi && oi.onchange) fileInput.onchange = oi.onchange;
                        }
                        fileLabel.appendChild(fileInput);
                        btnWrap.appendChild(fileLabel);
                        uploadZone.appendChild(btnWrap);
                        // 格式提示
                        var hint = document.createElement('div');
                        hint.className = 'format-hint';
                        hint.textContent = '支持 .csv / .xlsx / .xls 格式';
                        uploadZone.appendChild(hint);
                        uploadZone.style.border = 'none';
                        uploadZone.style.padding = '32px 0 0';
                    }
                }

                // 清理上一轮注入的 style/script（防止标签堆积 + CSS 规则累积 + 事件监听器泄漏），再一次挂载新内容
                subEl.querySelectorAll('style[data-sub-injected], script[data-sub-injected]').forEach(function(el){ el.remove(); });
                subEl.innerHTML = '';
                subEl.classList.remove('is-loading');
                subEl.appendChild(frag);

                // 执行子页面内联脚本（脚本必须在挂载后执行，才能取到元素）
                var scripts = tmp.querySelectorAll('script:not([src])');
                scripts.forEach(function(s){
                    // 跳过 omega 编辑层脚本，不需要重复执行
                    if (s.hasAttribute('data-omega-edit-layer') || (s.textContent || '').indexOf('__OMEGA__') >= 0) return;
                    var ns = document.createElement('script');
                    ns.setAttribute('data-sub-injected', '1');
                    // 用原生注入：不包裹 IIFE，确保子页面的 startConvert 等函数可被 onclick 全局访问
                    ns.textContent = s.textContent;
                    subEl.appendChild(ns);
                });
            } else {
                subEl.innerHTML = '<div class="sub-page-body">' + tmp.innerHTML + '</div>';
                subEl.classList.remove('is-loading');
            }
        })
        .catch(function(e){
            subEl.classList.remove('is-loading');
            if (!subEl.querySelector('.sub-page-body')){
                subEl.innerHTML = '<div class="sub-loading error">加载失败，请刷新重试</div>';
            }
        });
}

// ═══════════════════════════════════════
function getShiftData() {
    if (window.SHIFT_DATA && Array.isArray(window.SHIFT_DATA) && window.SHIFT_DATA.length) return window.SHIFT_DATA;
    try {
        var dataStr = localStorage.getItem('importedShiftData');
        if (dataStr) return JSON.parse(dataStr);
    } catch(e) {}
    return [];
}

var REST_TYPES = ['休','休息','off','年假','年','leave'];
var NIGHT_HINTS = ['晚','夜','小夜','night'];
var SHIFT_NAME_SET = {
    '早班':1,'早班2':1,'白班':1,'正常班':1,'日班':1,
    '夜班':1,'夜班2':1,'夜班3':1,'小夜':1,'小夜班':1,'小夜班2':1,'小夜班3':1,
    '晚班':1,'晚班2':1,'休':1,'休息':1
};
var SUMMARY_ROWS = ['日实际出勤','争议白班值班','争议夜班值班','备注','合计'];
var AVATAR_COLORS = ['blue','green','purple','orange','pink','cyan','gold','rose','teal','indigo'];

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
}
function isRest(v){ for (var i=0;i<REST_TYPES.length;i++){ if(v===REST_TYPES[i]) return true; } return false; }
function isNightShift(v){ for (var i=0;i<NIGHT_HINTS.length;i++){ if(String(v).indexOf(NIGHT_HINTS[i])>=0) return true; } return false; }
function mapShiftName(v){
    if (!v) return v;
    var s = String(v).trim();
    if (isNightShift(s)) return '夜班';
    return '白班';
}
function isSummaryRow(name){
    if (!name) return true;
    if (SHIFT_NAME_SET[name]) return true;
    for (var i=0;i<SUMMARY_ROWS.length;i++){ if(name.indexOf(SUMMARY_ROWS[i])>=0) return true; }
    return false;
}
function pickCol(sample, hint){
    if (!sample || typeof sample !== 'object') return null;
    var keys = Object.keys(sample);
    for (var i=0;i<keys.length;i++){ if(keys[i].indexOf(hint)>=0) return keys[i]; }
    return null;
}
// 兜底姓名列解析：处理 xlsx 合并表头导致列名退化为 __EMPTY/__EMPTY_1/_1 等情况
function resolveNameCols(sample){
    if (!sample || typeof sample !== 'object') return {cn:null,eng:null};
    var cn = pickCol(sample,'中文') || pickCol(sample,'中文名') || pickCol(sample,'__EMPTY_1') || pickCol(sample,'_2') || null;
    var eng = pickCol(sample,'英文') || pickCol(sample,'英文名') || pickCol(sample,'__EMPTY_2') || pickCol(sample,'__EMPTY') || pickCol(sample,'_1') || null;
    return {cn:cn,eng:eng};
}
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function getDateShift(row, month, day){
    var keys = Object.keys(row);
    for (var i=0;i<keys.length;i++){
        var k = keys[i];
        var m = String(k).match(/(\d+)年(\d+)月(\d+)日$/);
        var mm, dd;
        if (m) { mm=parseInt(m[2],10); dd=parseInt(m[3],10); }
        else {
            var m2 = String(k).match(/^(\d+)月(\d+)日$/);
            if (!m2) continue;
            mm=parseInt(m2[1],10); dd=parseInt(m2[2],10);
        }
        if (mm===month && dd===day) return String(row[k]||'').trim();
    }
    return '';
}
function findUserRow(data, user){
    if (!user) return null;
    var nc = data[0] ? resolveNameCols(data[0]) : {cn:null,eng:null};
    // 优先英文名匹配
    if (nc.eng){
        for (var i=0;i<data.length;i++){
            var row = data[i];
            var eng = String(row[nc.eng]||'').trim();
            if (!eng || isSummaryRow(eng)) continue;
            if (eng.toLowerCase() === user.toLowerCase()) return row;
        }
    }
    // fallback: 中文名匹配
    if (nc.cn) {
        for (var j=0;j<data.length;j++){
            var c = String(data[j][nc.cn]||'').trim();
            if (c && !isSummaryRow(c) && c.toLowerCase()===user.toLowerCase()) return data[j];
        }
    }
    return null;
}

// 日历渲染
// ═════════════════════════════════════
var MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var WEEKDAYS = ['日','一','二','三','四','五','六'];
var calYear, calMonth;

function renderCalendar(year, month){
    var cal = document.getElementById('calendar');
    cal.innerHTML = '';
    var today = new Date();
    var isCur = (year===today.getFullYear() && month===today.getMonth());
    var firstDay = new Date(year, month, 1).getDay();
    var dim = daysInMonth(year, month);

    var header = document.createElement('div');
    header.className = 'card-header';
    var title = document.createElement('div');
    title.className = 'card-title';
    title.innerHTML = year + '年 ' + MONTHS[month] + '<span class="card-title-sub">排班总览</span>';
    var nav = document.createElement('div');
    nav.className = 'cal-nav';
    var prev = document.createElement('button');
    prev.className = 'cal-nav-btn'; prev.textContent='◀'; prev.onclick=function(){ changeMonth(-1); };
    var next = document.createElement('button');
    next.className = 'cal-nav-btn'; next.textContent='▶'; next.onclick=function(){ changeMonth(1); };
    nav.appendChild(prev); nav.appendChild(next);
    // 月份标题旁的引导（由 displayUserShifts 填内容，空时自动隐藏）
    var hint = document.createElement('span');
    hint.className = 'cal-hint';
    hint.id = 'cal-hint';
    var left = document.createElement('div');
    left.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap';
    left.appendChild(title); left.appendChild(hint);
    header.appendChild(left); header.appendChild(nav);
    cal.appendChild(header);

    var legend = document.createElement('div');
    legend.className = 'cal-legend';
    legend.innerHTML = '<div class="legend-item"><div class="legend-dot blue"></div>白班</div><div class="legend-item"><div class="legend-dot orange"></div>夜班</div><div class="legend-item"><div class="legend-dot red"></div>休息</div><div class="legend-item"><div class="legend-dot purple"></div>请假</div>';
    cal.appendChild(legend);

    var grid = document.createElement('div');
    grid.className = 'cal-grid';
    for (var w=0;w<7;w++){
        var h = document.createElement('div');
        h.className = 'cal-head' + (w===0||w===6 ? ' weekend' : '');
        h.textContent = WEEKDAYS[w];
        grid.appendChild(h);
    }

    function makeCell(dayNum, weekday, opts){
        opts = opts || {};
        var cell = document.createElement('div');
        cell.className = 'cal-cell' + (weekday===0||weekday===6 ? ' weekend-col' : '');
        if (opts.otherMonth){ cell.className += ' other-month'; }
        if (opts.empty){ cell.className += ' empty'; }
        else {
            cell.classList.add('clickable');
            cell.dataset.day = dayNum;
            cell.dataset.month = month + 1;
            cell.dataset.year = year;
            cell.addEventListener('click', function(){ showDayDetail(this); });
        }
        if (opts.isToday){ cell.classList.add('today'); }
        var dateEl = document.createElement('div');
        dateEl.className = 'cal-date';
        dateEl.textContent = dayNum;
        cell.appendChild(dateEl);
        return cell;
    }

    // 上月尾部
    var daysPrev = daysInMonth(year, month-1);
    for (var i = firstDay - 1; i >= 0; i--){
        var pd = daysPrev - i;
        var pw = new Date(year, month-1, pd).getDay();
        grid.appendChild(makeCell(pd, pw, {otherMonth:true, empty:true}));
    }
    // 本月
    for (var d=1; d<=dim; d++){
        var dw = new Date(year, month, d).getDay();
        grid.appendChild(makeCell(d, dw, {isToday:(isCur && d===today.getDate())}));
    }
    // 下月头部
    var total = firstDay + dim;
    var remain = total <= 35 ? (35 - total) : (42 - total);
    for (var n=1; n<=remain; n++){
        var nw = new Date(year, month+1, n).getDay();
        grid.appendChild(makeCell(n, nw, {otherMonth:true, empty:true}));
    }
    cal.appendChild(grid);
}

function initCalendar(){
    var now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
}

// 主页一次性渲染：日历 → 班次标注 → 统计卡片 → 选中日期 → 出勤面板 → 画板尺寸
// 原来是 4 个 setTimeout 依次触发，切换页面 / 切换查看人时会闪
function renderHome(){
    renderCalendar(calYear, calMonth);
    displayUserShifts();
    var data = getShiftData();
    var now = new Date();
    updateStatsCards(data, now.getFullYear(), now.getMonth()+1, now.getDate());
    refreshWhoOptions();
    var keep = (selDay && selDay.y === calYear && selDay.m === calMonth + 1) ? selDay : null;
    var tc = keep ? document.querySelector('#calendar .cal-cell:not(.other-month)[data-day="' + keep.d + '"]')
                  : ((calYear === now.getFullYear() && calMonth === now.getMonth())
                        ? document.querySelector('#calendar .cal-cell.today:not(.other-month)') : null);
    if (tc){
        tc.classList.add('selected');
        updateDetailPanel(parseInt(tc.dataset.year,10), parseInt(tc.dataset.month,10), parseInt(tc.dataset.day,10));
    }
    renderOverview();
    resizeBoard();
}

function changeMonth(delta){
    calMonth += delta;
    if (calMonth > 11){ calMonth = 0; calYear++; }
    if (calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar(calYear, calMonth);
    displayUserShifts();
    var now = new Date();
    // 原来选中的日子在这个月就保留；否则当月选今天、其他月选 1 号
    var d = 1;
    if (selDay && selDay.y === calYear && selDay.m === calMonth + 1) d = selDay.d;
    else if (calYear === now.getFullYear() && calMonth === now.getMonth()) d = now.getDate();
    var tc = document.querySelector('#calendar .cal-cell:not(.other-month)[data-day="' + d + '"]');
    if (tc){
        tc.classList.add('selected');
        updateDetailPanel(calYear, calMonth + 1, d);
    }
}

// 点击日期 → 联动详情面板
function showDayDetail(el){
    document.querySelectorAll('.cal-cell.selected').forEach(function(c){ c.classList.remove('selected'); });
    el.classList.add('selected');
    var day = parseInt(el.dataset.day, 10);
    var month = parseInt(el.dataset.month, 10);
    var year = parseInt(el.dataset.year, 10);
    updateDetailPanel(year, month, day);
}

// 详情面板：按选中日期列出出勤人员
// ═════════════════════════════════════
function uniqueShifts(list){
    var s = {};
    for (var i=0;i<list.length;i++) if (list[i].shift) s[list[i].shift] = 1;
    return Object.keys(s);
}

var selDay = null;   // 当前选中的日期 {y,m,d}，切换查看人时保持不变
function updateDetailPanel(year, month, day){
    selDay = { y: year, m: month, d: day };
    var data = getShiftData();
    var dt = new Date(year, month-1, day);
    var wname = WEEKDAYS[dt.getDay()];
    document.getElementById('detail-title').textContent = month + '月' + day + '日 出勤';
    document.getElementById('detail-date').textContent = year + '年' + month + '月' + day + '日 · 星期' + wname;

    function setEmpty(msg){
        document.getElementById('attendance-num').textContent = '--';
        document.getElementById('mini-white').textContent = '白班 0人';
        document.getElementById('mini-night').textContent = '夜班 0人';
        document.getElementById('count-day').textContent = '0人';
        document.getElementById('count-night').textContent = '0人';
        renderStaffList('day-staff-list', [], msg);
        renderStaffList('night-staff-list', [], msg);
    }
    if (!data.length){ setEmpty('还没有班表'); return; }

    var nameCols = resolveNameCols(data[0]);
    var cnCol = nameCols.cn, engCol = nameCols.eng;
    var dateKey = month + '月' + day + '日';
    var viewer = String(currentUser || '').toLowerCase();
    var rowName = function(r){ return (cnCol ? String(r[cnCol]||'').trim() : '') || (engCol ? String(r[engCol]||'').trim() : ''); };

    // 出勤人员：休息、请假都不算
    var dayList = [], nightList = [];
    for (var i=0;i<data.length;i++){
        var row = data[i];
        if (!row || typeof row !== 'object') continue;
        var name = rowName(row);
        if (!name || isSummaryRow(name)) continue;
        var en = engCol ? String(row[engCol]||'').trim() : '';
        var cnName = cnCol ? String(row[cnCol]||'').trim() : '';
        if (engCol && !isEnglishName(en)) continue;           // 表尾说明行（早班1 等）没有英文名
        if (cnName && isShiftLikeName(cnName)) continue;
        var v = String(row[dateKey]||'').trim();
        var c = classifyShift(v);
        if (!c || c.k === 'rest' || c.k === 'leave') continue;
        var person = { name: name, shift: v, me: !!viewer && (en.toLowerCase() === viewer || name.toLowerCase() === viewer) };
        if (c.k === 'night') nightList.push(person); else dayList.push(person);
    }

    // 值班人：表尾「争议白班值班 / 争议夜班值班」行；在出勤名单里就打徽章，不在就补进对应分组
    var dayDutyName = '', nightDutyName = '';
    for (var j=0;j<data.length;j++){
        var drow = data[j];
        if (!drow || typeof drow !== 'object') continue;
        var rawName = rowName(drow);
        if (rawName.indexOf('白班值班') >= 0 || rawName.indexOf('争议白班') >= 0) dayDutyName = String(drow[dateKey]||'').trim();
        if (rawName.indexOf('夜班值班') >= 0 || rawName.indexOf('争议夜班') >= 0) nightDutyName = String(drow[dateKey]||'').trim();
    }
    // 值班人：在当天出勤名单里找到就打徽章（徽章写明是白班值班还是夜班值班）；
    // 找不到（当天休息 / 请假 / 名字对不上）就不补进名单，避免把不在岗的人列成出勤
    var dutyMiss = [];
    function markDuty(dutyName, label){
        if (!dutyName) return;
        var all = dayList.concat(nightList);
        for (var k=0;k<all.length;k++){
            if (all[k].name === dutyName){ all[k].duty = all[k].duty ? all[k].duty + ' / ' + label : label; return; }
        }
        dutyMiss.push(label + '：' + dutyName);
    }
    markDuty(dayDutyName, '白班值班');
    markDuty(nightDutyName, '夜班值班');
    // 值班人排在最前，其余保持表格顺序
    var byDuty = function(a, b){ return (b.duty ? 1 : 0) - (a.duty ? 1 : 0); };
    dayList.sort(byDuty); nightList.sort(byDuty);

    var total = dayList.length + nightList.length;
    document.getElementById('attendance-num').textContent = total;
    document.getElementById('mini-white').textContent = '白班 ' + dayList.length + '人';
    document.getElementById('mini-night').textContent = '夜班 ' + nightList.length + '人';
    document.getElementById('count-day').textContent = dayList.length + '人';
    document.getElementById('count-night').textContent = nightList.length + '人';
    renderStaffList('day-staff-list', dayList, '当天没有白班');
    renderStaffList('night-staff-list', nightList, '当天没有夜班');
    var dm = document.getElementById('duty-miss');
    if (dm){
        dm.textContent = dutyMiss.length ? '⚠ ' + dutyMiss.join('；') + '（当天不在岗）' : '';
    }
}

function renderStaffList(id, list, emptyText){
    var c = document.getElementById(id);
    if (!c) return;
    c.innerHTML = '';
    if (!list.length){
        var empty = document.createElement('div');
        empty.className = 'staff-empty';
        empty.textContent = emptyText || '暂无人员';
        c.appendChild(empty);
        return;
    }
    for (var i=0;i<list.length;i++){
        var p = list[i];
        // 按人名固定颜色（同名字在任何列表中颜色一致）
        var hash = 0;
        for (var h=0;h<p.name.length;h++){ hash = ((hash<<5)-hash) + p.name.charCodeAt(h); }
        var color = AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
        var night = isNightShift(p.shift);
        var item = document.createElement('div');
        item.className = 'staff-item' + (p.me ? ' me' : '');
        // XSS 安全：DOM API + textContent
        var avatar = document.createElement('div');
        avatar.className = 'staff-avatar ' + color;
        avatar.textContent = p.name.charAt(0);
        var nameWrap = document.createElement('div');
        nameWrap.style.cssText = 'flex:1;min-width:0';
        var nameEl = document.createElement('div');
        nameEl.className = 'staff-name';
        nameEl.textContent = p.name;
        if (p.me){ var meEl = document.createElement('span'); meEl.className = 'staff-me'; meEl.textContent = '当前查看'; nameEl.appendChild(meEl); }
        nameWrap.appendChild(nameEl);
        var tags = document.createElement('div');
        tags.className = 'staff-tags';
        if (p.duty){
            var duty = document.createElement('span');
            duty.className = 'staff-duty';
            duty.textContent = p.duty.indexOf(' / ') >= 0 ? '双值班' : p.duty;
            duty.title = p.duty;
            tags.appendChild(duty);
        }
        if (p.shift){
            var tag = document.createElement('span');
            tag.className = 'staff-shift-tag ' + (night ? 'night' : 'day');
            tag.textContent = p.shift;
            tags.appendChild(tag);
        }
        item.appendChild(avatar);
        item.appendChild(nameWrap);
        item.appendChild(tags);
        c.appendChild(item);
    }
}

function setText(id, v){ var el=document.getElementById(id); if(el) el.textContent = v; }

// 2026 中国法定节假日（国务院办公厅公布）。off=放假日，work=周末补班日。每年需更新。
var HOLIDAYS_2026 = {
  off: new Set(['1-1','1-2','1-3','2-15','2-16','2-17','2-18','2-19','2-20','2-21','2-22','2-23','4-4','4-5','4-6','5-1','5-2','5-3','5-4','5-5','6-19','6-20','6-21','9-25','9-26','9-27','10-1','10-2','10-3','10-4','10-5','10-6','10-7']),
  work: new Set(['1-4','2-14','2-28','5-9','9-20','10-10'])
};
function isWorkday(d){
  var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate(), key=m+'-'+day;
  if (y===2026){
    if (HOLIDAYS_2026.off.has(key)) return false;
    var dow=d.getDay();
    if (dow===0||dow===6) return HOLIDAYS_2026.work.has(key); // 调休补班日算上班
    return true;
  }
  var dw=d.getDay(); // 非2026年无节假日数据，仅按周末判断
  return !(dw===0||dw===6);
}

function updateStatsCards(data, year, month, day){
    var totalDays = 20, present = 5, restLeft = 3, payLeft = 35;
    if (data.length){
        var userRow = findUserRow(data, currentUser);
        if (userRow){
            // 本月出勤天数：从上月21号（今天<21号）或本月21号（今天>=21号）算到今天，休息不计入
            totalDays = 0;
            var startYear = year, startMonth = month;
            if (day < 21){
                startMonth = month - 1;
                if (startMonth < 1){ startMonth = 12; startYear = year - 1; }
            }
            var sDate = new Date(startYear, startMonth - 1, 21);
            var eDate = new Date(year, month - 1, day);
            var diffDays = Math.round((eDate.getTime() - sDate.getTime()) / 86400000);
            for (var di=0; di<=diffDays; di++){
                var cDate = new Date(startYear, startMonth - 1, 21 + di);
                var cv = getDateShift(userRow, cDate.getMonth()+1, cDate.getDate());
                if (cv && !isRest(cv)) totalDays++;
            }
            // 距离休息还有
            restLeft = null;
            for (var off=1; off<=31; off++){
                var nd = new Date(year, month-1, day + off);
                var nm = nd.getMonth()+1, nd2 = nd.getDate();
                var sv = getDateShift(userRow, nm, nd2);
                if (sv && isRest(sv)){ restLeft = off; break; }
            }
        }
        present = 0;
        var nameCols = resolveNameCols(data[0]);
        var cnCol = nameCols.cn;
        var engCol = nameCols.eng;
        var dateKey = month + '月' + day + '日';
        for (var i=0;i<data.length;i++){
            var row=data[i];
            if(!row||typeof row!=='object') continue;
            var nm2 = (cnCol?String(row[cnCol]||'').trim():'') || (engCol?String(row[engCol]||'').trim():'');
            if(!nm2||isSummaryRow(nm2)) continue;
            var v2 = String(row[dateKey]||'').trim();
            if(v2 && !isRest(v2)) present++;
        }
        // 距离发工资还有：固定每月5号，遇周六日或法定节假日提前至最后一个工作日（与个人班次无关）
        payLeft = null;
        var payYear = year, payMonth = month;
        if (day > 5){
            payMonth = month + 1;
            if (payMonth > 12){ payMonth = 1; payYear = year + 1; }
        }
        var payDate = null;
        for (var back=0; back<=25; back++){
            var cand = new Date(payYear, payMonth - 1, 5 - back);
            if (isWorkday(cand)){ payDate = cand; break; }
        }
        if (!payDate) payDate = new Date(payYear, payMonth - 1, 5);
        payLeft = Math.round((payDate.getTime() - new Date(year, month-1, day).getTime()) / 86400000);
    }
    // 统计卡统一结构：上面大数字 + 单位，下面小标签；特殊文案时大字显示文案
    function statHtml(num, unit, label){
        return '<div class="stat-value"><span class="num">'+num+'</span><span class="unit">'+unit+'</span></div><div class="stat-label">'+label+'</div>';
    }
    function statSpecial(text, label){
        return '<div class="stat-value"><span class="num special">'+text+'</span></div><div class="stat-label">'+label+'</div>';
    }
    var el1=document.getElementById('stat-total-days'); if(el1) el1.innerHTML=statHtml(totalDays,'天','本月出勤天数');
    var el2=document.getElementById('stat-present'); if(el2) el2.innerHTML=statHtml(present,'人','今日出勤人数');
    var el3=document.getElementById('stat-rest-left');
    if (el3){
        // 检测今天是否为休息日
        var todayIsRest = false;
        if (userRow){
            var todayShift = getDateShift(userRow, month, day);
            if (todayShift && isRest(todayShift)) todayIsRest = true;
        }
        if (todayIsRest){
            el3.innerHTML=statSpecial('要好好休息喔~','今天休息');
        } else if (restLeft === 1){
            el3.innerHTML=statSpecial('明天就休息啦！！！','距离休息还有 1 天');
        } else {
            el3.innerHTML=statHtml((restLeft==null?3:restLeft),'天','距离休息还有');
        }
    }
    var el4=document.getElementById('stat-pay-left');
    if (el4){
        if (payLeft === null) payLeft = 35;
        if (payLeft <= 0){
            el4.innerHTML=statSpecial('首富已上位~有钱！消费！','今天发窝囊废');
        } else if (payLeft === 1){
            el4.innerHTML=statSpecial('明天就发赈灾粮啦！','距离发窝囊废还有 1 天');
        } else {

// 班次分类：白 / 夜 / 休 / 假（日历短标签、色条共用）
function classifyShift(v){
    var s = String(v||'').trim();
    if (!s) return null;
    if (/假/.test(s) || s === '年' || /leave/i.test(s)) return { k:'leave', t:'假' };
    if (isRest(s) || /休/.test(s) || /^off$/i.test(s)) return { k:'rest', t:'休' };
    if (isNightShift(s)) return { k:'night', t:'夜' };
    return { k:'day', t:'白' };
}
function displayUserShifts(){
    var hint = document.getElementById('cal-hint');
    var setHint = function(text, page){
        if (!hint) return;
        hint.textContent = text || '';
        hint.title = text ? '点击前往' : '';
        hint.onclick = text && page ? function(){ navigateTo(page); } : null;
    };
    var data = getShiftData();
    if (!data.length){ setHint('还没有班表 · 去数据导入 ›', 'import'); return; }
    if (!currentUser){ setHint(''); return; }
    var userRow = findUserRow(data, currentUser);
    if (!userRow){ setHint(''); return; }

    var shiftMap = {};
    var keys = Object.keys(userRow);
    for (var i=0;i<keys.length;i++){
        var k = keys[i];
        var m = String(k).match(/(\d+)年(\d+)月(\d+)日$/) || String(k).match(/^(\d+)月(\d+)日$/);
        if (!m) continue;
        var mm, dd;
        if (m.length===4){ mm=parseInt(m[2],10); dd=parseInt(m[3],10); }
        else { mm=parseInt(m[1],10); dd=parseInt(m[2],10); }
        var v = String(userRow[k]||'').trim();
        if (!v) continue;
        if (!shiftMap[mm]) shiftMap[mm] = {};
        shiftMap[mm][dd] = v;
    }

    var mo = calMonth + 1;
    var now = new Date();
    var todayKey = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
    var firstMissing = 0;
    var cells = document.querySelectorAll('#calendar .cal-cell:not(.other-month)');
    cells.forEach(function(cell){
        var d = parseInt(cell.querySelector('.cal-date').textContent, 10);
        if (!d) return;
        var sv = shiftMap[mo] ? shiftMap[mo][d] : null;
        // 今天及以后还没有班表的日子：记下第一天，用于月份标题旁的引导（重复调用时也要算）
        if (!sv && calYear*10000 + mo*100 + d >= todayKey && !firstMissing) firstMissing = d;
        if (cell.querySelector('.cal-shift')) return;   // 已标注过，不重复加
        var tag = document.createElement('span');
        if (!sv){
            // 今天及以后标「未排」；过去没数据的日子保持空白
            if (calYear*10000 + mo*100 + d < todayKey) return;
            tag.className = 'cal-shift s-none';
            tag.textContent = '未排';
            cell.appendChild(tag);
            return;
        }
        var c = classifyShift(sv);
        tag.className = 'cal-shift s-' + c.k;
        tag.textContent = c.t;
        tag.title = sv;                 // 悬停显示完整班次名，如「小夜班3」「年假」
        cell.title = mo + '月' + d + '日：' + sv;
        cell.setAttribute('data-s', c.k);
        cell.appendChild(tag);
    });
    if (firstMissing){
        setHint(firstMissing === 1 ? '本月还没有班表 · 去智能排班 ›'
            : mo + '/' + firstMissing + ' 起还没有班表 · 去智能排班 ›', 'scheduler');
    } else {
        setHint('');
    }
}

// 当前账号（固定账号，已移除登录流程）
// ═════════════════════════════════════
var currentUser = DEFAULT_USER;

// ═════════════════════════════════════
// 左下角：输入姓名 → 主页展示对应班表
//   支持中文名 / 英文名（不区分大小写）：完全匹配 > 前缀匹配 > 包含匹配；多人命中时提示写全
//   识别结果记在 localStorage，刷新后保持
// ═════════════════════════════════════
var WHO_KEY = 'viewer_name';
// 班次 / 说明类行的名字：早班1、白班、小夜班3、休、9 - 18 等，不是人
function isShiftLikeName(s){
    s = String(s||'').trim();
    if (!s) return true;
    if (isSummaryRow(s)) return true;
    if (/(班|休|假)\s*\d*$/.test(s)) return true;          // 早班1 / 小夜班3 / 休 / 年假
    if (/^\d+\s*[-~～:：]\s*\d+$/.test(s)) return true;   // 9 - 18 这类时间段
    return false;
}
// 英文名：字母开头，只含字母 / 数字 / 点 / 下划线 / 连字符 / 空格
function isEnglishName(s){ return /^[A-Za-z][A-Za-z0-9._\- ]*$/.test(String(s||'').trim()); }
function listPeople(data){
    var out = [], seen = {};
    if (!data || !data.length) return out;
    var nc = resolveNameCols(data[0]);
    for (var i=0;i<data.length;i++){
        var r = data[i];
        if (!r || typeof r !== 'object') continue;
        var cn = nc.cn ? String(r[nc.cn]||'').trim() : '';
        var en = nc.eng ? String(r[nc.eng]||'').trim() : '';
        // 只认有英文名的真人行；中文名是班次名（早班1 等）的说明行一律排除
        if (!isEnglishName(en)) continue;
        if (cn && isShiftLikeName(cn)) continue;
        var key = en.toLowerCase();
        if (seen[key]) continue;
        // 必须至少有一个日期格有值，排除表尾说明行
        var hasShift = Object.keys(r).some(function(k){ return /月\d+日$/.test(k) && String(r[k]||'').trim(); });
        if (!hasShift) continue;
        seen[key] = 1;
        out.push({ cn: cn, en: en, row: r });
    }
    return out;
}
// 返回 { person, how, candidates }；how: exact / prefix / contains / initials
function matchPerson(people, q){
    q = String(q||'').trim();
    if (!q) return { person: null, candidates: [] };
    var ql = q.toLowerCase().replace(/\s+/g, '');
    var hit = function(fn){ return people.filter(fn); };
    var lc = function(s){ return String(s||'').toLowerCase().replace(/\s+/g, ''); };
    var tiers = [
        ['exact',    function(p){ return lc(p.cn) === ql || lc(p.en) === ql; }],
        ['prefix',   function(p){ return (p.cn && lc(p.cn).indexOf(ql) === 0) || (p.en && lc(p.en).indexOf(ql) === 0); }],
        ['contains', function(p){ return (p.cn && lc(p.cn).indexOf(ql) >= 0) || (p.en && lc(p.en).indexOf(ql) >= 0); }]
    ];
    for (var i=0;i<tiers.length;i++){
        var c = hit(tiers[i][1]);
        if (c.length === 1) return { person: c[0], how: tiers[i][0], candidates: c };
        if (c.length > 1)  return { person: null, how: tiers[i][0], candidates: c };
    }
    return { person: null, candidates: [] };
}
function personLabel(p){ return p.cn && p.en ? (p.cn + '（' + p.en + '）') : (p.cn || p.en); }

var whoStatusTimer = null;
function setWhoStatus(text, cls){
    var el = document.getElementById('who-status');
    if (!el) return;
    el.textContent = text;
    el.title = text;
    el.className = 'who-status' + (cls ? ' ' + cls : '');
    // 识别成功的提示 3 秒后自动隐藏，警告 / 错误一直显示到下次输入
    clearTimeout(whoStatusTimer);
    if (cls === 'ok') whoStatusTimer = setTimeout(function(){ el.textContent = ''; }, 3000);
}
function refreshWhoOptions(){

    if (!dl) return;
    dl.innerHTML = '';

// 按输入切换「当前查看的人」，并刷新主页所有按人计算的区域
function setViewer(q, opts){
    opts = opts || {};
    var data = getShiftData();
    var avatar = document.getElementById('who-avatar');
    q = String(q||'').trim();
    if (!q){
        try { localStorage.removeItem(WHO_KEY); } catch(e){}
        currentUser = DEFAULT_USER;
        if (avatar){ avatar.textContent = '?'; avatar.classList.remove('miss'); }
        setWhoStatus('');
        refreshViewer();
        return;
    }
    if (!data.length){
        setWhoStatus('还没有班表数据，请先在「数据导入」导入班表', 'warn');
        if (avatar){ avatar.textContent = q.charAt(0).toUpperCase(); avatar.classList.add('miss'); }
        try { localStorage.setItem(WHO_KEY, q); } catch(e){}
        currentUser = q;
        refreshViewer();
        return;
    }
    var people = listPeople(data);
    var m = matchPerson(people, q);
    if (m.person){
        var p = m.person;
        // findUserRow 先按英文名、再按中文名匹配，这里用识别出的真实姓名
        currentUser = p.en;
        try { localStorage.setItem(WHO_KEY, p.en); } catch(e){}
        if (avatar){ avatar.textContent = (p.cn || p.en).charAt(0).toUpperCase(); avatar.classList.remove('miss'); }
        var input = document.getElementById('who-input');
        if (input && opts.fill !== false) input.value = p.en;
        setWhoStatus('✓ 已识别：' + personLabel(p), 'ok');
    } else if (m.candidates.length > 1){
        setWhoStatus('匹配到多人：' + m.candidates.slice(0,5).map(function(x){ return x.en; }).join('、') + '，请写全一点', 'warn');
        if (avatar){ avatar.textContent = '?'; avatar.classList.add('miss'); }
        return;   // 不切换，保持上一个人
    } else {
        var all = people.map(function(x){ return x.en; });
        setWhoStatus('班表里找不到「' + q + '」' + (all.length ? '，可选：' + all.slice(0,8).join('、') : ''), 'err');
        if (avatar){ avatar.textContent = '?'; avatar.classList.add('miss'); }
        return;
    }
    refreshViewer();
}
// 刷新主页里与「当前查看的人」相关的区域：日历班次标注、统计卡片
function refreshViewer(){
    if (currentPage !== 'calendar') return;
    renderCalendar(calYear, calMonth);
    displayUserShifts();
    var now = new Date();
    updateStatsCards(getShiftData(), now.getFullYear(), now.getMonth()+1, now.getDate());
    // 保持原来选中的日期；不在当前显示的月份时退回今天

    var sel = keep ? document.querySelector('#calendar .cal-cell:not(.other-month)[data-day="' + keep.d + '"]')
                   : document.querySelector('#calendar .cal-cell.today:not(.other-month)');
    if (sel){
        sel.classList.add('selected');
        updateDetailPanel(parseInt(sel.dataset.year,10), parseInt(sel.dataset.month,10), parseInt(sel.dataset.day,10));
    }
    renderOverview();
}
function initWhoBox(){
    var input = document.getElementById('who-input');
    var clear = document.getElementById('who-clear');
    if (!input) return;
    refreshWhoOptions();
    input.addEventListener('focus', refreshWhoOptions);   // 导入新班表后，候选名单即时更新
    input.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); setViewer(input.value); }
        if (e.key === 'Escape'){ input.value = ''; setViewer(''); }
    });
    // 从下拉候选里选中 / 输入完全匹配时直接切换，不用再按回车
    input.addEventListener('input', function(){
        var q = input.value.trim();
        if (!q) return;
        var m = matchPerson(listPeople(getShiftData()), q);
        if (m.person && m.how === 'exact') setViewer(q, { fill: false });
    });
    input.addEventListener('change', function(){ if (input.value.trim()) setViewer(input.value); });
    if (clear) clear.addEventListener('click', function(){ input.value = ''; setViewer(''); input.focus(); });
    var saved = '';
    try { saved = localStorage.getItem(WHO_KEY) || ''; } catch(e){}
    if (saved){ input.value = saved; setViewer(saved); }
}

function applyUser(name){
