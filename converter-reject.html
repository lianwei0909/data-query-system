<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不过审数据转换工具</title>
    <script src="./xlsx.full.min.js"></script>
    <script src="common.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        html { min-width: 1400px; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%);
            color: #fff;
            min-height: 100vh;
            min-width: 1400px;
            overflow-x: auto;
            position: relative;
        }
        .bg-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(8,6,18,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:0; pointer-events:none; z-index:1; }
        .container { position:relative; z-index:10; width:1400px; min-width:auto; max-width:1400px; margin:0 auto; padding:40px; }

        /* 模块分类导航 */
        .module-nav { display:flex; justify-content:center; gap:24px; margin-bottom:35px; animation:fadeInDown .6s ease-out both; }
        .module-btn { display:flex; align-items:center; gap:10px; padding:16px 48px; border-radius:50px; font-size:1.15em; font-weight:600; cursor:pointer; transition:all .35s cubic-bezier(.16,1,.3,1); border:2px solid transparent; position:relative; overflow:hidden; text-decoration:none; user-select:none; }
        .module-btn .icon { font-size:1.2em; line-height:1; }
        .module-btn.approve { background:rgba(255,255,255,.05); border-color:rgba(102,126,234,.4); color:rgba(255,255,255,.85); }
        .module-btn.approve:hover { transform:translateY(-3px) scale(1.04); background:rgba(102,126,234,.12); border-color:rgba(102,126,234,.7); box-shadow:0 8px 30px rgba(102,126,234,.2); }
        .module-btn.reject { background:rgba(255,255,255,.05); border-color:rgba(239,68,68,.4); color:rgba(255,255,255,.85); }
        .module-btn.reject:hover { transform:translateY(-3px) scale(1.04); background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.7); box-shadow:0 8px 30px rgba(239,68,68,.2); }
        .module-btn.reject.active { background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%); border-color:transparent; color:#fff; box-shadow:0 10px 40px rgba(239,68,68,.4); }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }

        .btn-back { position:fixed; top:24px; left:24px; z-index:100; display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:50px; font-size:.95em; font-weight:600; text-decoration:none; background:rgba(255,255,255,.08); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.88); transition:all .3s; cursor:pointer; user-select:none; letter-spacing:.5px; }
        .btn-back:hover { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.35); transform:translateX(-4px); color:#fff; box-shadow:0 4px 20px rgba(0,0,0,.25); }

        .upload-section { background:rgba(255,255,255,.03); backdrop-filter:blur(20px); border:2px dashed rgba(239,68,68,.35); border-radius:20px; padding:40px 30px; text-align:center; margin-bottom:35px; position:relative; overflow:hidden; transition:all .3s ease; animation:fadeInUp .8s ease-out .2s both; cursor:pointer; }
        .upload-section.drag-over { border-color:rgba(239,68,68,.9)!important; border-style:solid!important; background:rgba(239,68,68,.12)!important; box-shadow:0 0 80px rgba(239,68,68,.25),inset 0 0 40px rgba(239,68,68,.08); transform:scale(1.02)!important; }
        .upload-section h2 { font-size:1.4em; margin-bottom:8px; font-weight:600; }
        .upload-section p { color:rgba(255,255,255,.6); font-size:.95em; }
        .drag-hint svg { transition:transform .3s ease; margin:15px auto; display:block; }
        .upload-section.drag-over .drag-hint svg { transform:translateY(-8px) scale(1.1); stroke:rgba(239,68,68,.9); }
        .file-input-wrapper { display:inline-block; margin-top:16px; position:relative; }
        .file-input { position:absolute; width:0; height:0; opacity:0; }
        .file-label { display:inline-block; padding:14px 40px; border:2px dashed rgba(239,68,68,.4); border-radius:14px; background:rgba(239,68,68,.08); color:rgba(255,255,255,.85); font-size:1em; cursor:pointer; transition:all .3s ease; }
        .file-label:hover { border-color:rgba(239,68,68,.8); background:rgba(239,68,68,.15); box-shadow:0 4px 20px rgba(239,68,68,.2); }

        .preview-section { display:none; background:rgba(255,255,255,.03); backdrop-filter:blur(20px); border:1px solid rgba(239,68,68,.2); border-radius:20px; padding:30px; margin-bottom:35px; animation:fadeInUp .6s ease-out both; }
        .preview-section.active { display:block; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
        .stats-row { display:flex; gap:20px; margin-bottom:25px; justify-content:center; flex-wrap:wrap; }
        .stat-card { flex:0 1 auto; min-width:140px; background:rgba(239,68,68,.1); border-radius:12px; padding:20px 28px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .stat-number { font-size:2em; font-weight:700; background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; text-align:center; }
        .stat-label { font-size:.9em; color:rgba(255,255,255,.6); margin-top:5px; text-align:center; }
        .stat-error { background:rgba(239,68,68,.12)!important; border:1px solid rgba(239,68,68,.35)!important; }
        .stat-error .stat-number { background:linear-gradient(90deg,#f87171,#ef4444)!important; -webkit-background-clip:text!important; background-clip:text!important; }
        .stat-error .stat-label { color:rgba(248,113,113,.8)!important; }
        .table-wrapper { overflow-x:auto; border-radius:14px; border:1px solid rgba(239,68,68,.2); margin-bottom:25px; }
        table { width:100%; border-collapse:collapse; font-size:10pt; }
        th { background:rgba(239,68,68,.12); padding:12px 14px; text-align:center; font-weight:600; color:rgba(255,255,255,.9); border-bottom:1px solid rgba(239,68,68,.3); white-space:nowrap; }
        td { padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.06); color:rgba(255,255,255,.75); text-align:center; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        tr:hover td { background:rgba(255,255,255,.03); }

        .btn-group { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }
        .btn { padding:12px 35px; border:none; border-radius:50px; font-size:1em; font-weight:600; cursor:pointer; transition:all .3s ease; letter-spacing:1px; }
        .btn-primary { background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%); color:white; box-shadow:0 4px 20px rgba(239,68,68,.4); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(239,68,68,.6); }
        .btn-secondary { background:rgba(255,255,255,.1); color:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.2); }
        .btn-secondary:hover { background:rgba(255,255,255,.15); transform:translateY(-2px); }

        .pagination-wrapper { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:25px; flex-wrap:wrap; }
        .pagination-info { color:rgba(255,255,255,.6); font-size:.9em; }
        .page-btn { padding:8px 18px; border:1px solid rgba(239,68,68,.4); border-radius:8px; background:rgba(239,68,68,.08); color:rgba(255,255,255,.85); font-size:.9em; cursor:pointer; transition:all .2s ease; }
        .page-btn:hover:not(:disabled) { background:rgba(239,68,68,.25); border-color:rgba(239,68,68,.7); }
        .page-btn:disabled { opacity:.35; cursor:not-allowed; }

        .loader { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,10,30,.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .loader.active { display:flex; }
        .spinner { width:60px; height:60px; border:4px solid rgba(239,68,68,.3); border-top-color:#ef4444; border-radius:50%; animation:spin 1s linear infinite; }
        .loader-text { margin-top:25px; font-size:1.2em; color:rgba(255,255,255,.8); letter-spacing:1px; }
        @keyframes spin { to{transform:rotate(360deg);} }

        .notification { position:fixed; top:30px; right:30px; padding:16px 30px; border-radius:14px; font-size:1em; font-weight:600; z-index:10000; transform:translateX(120%); transition:transform .4s cubic-bezier(.16,1,.3,1); backdrop-filter:blur(20px); }
        .notification.show { transform:translateX(0); }
        .notification.success { background:rgba(16,185,129,.2); border:1px solid rgba(16,185,129,.5); color:#6ee7b7; }
        .notification.error { background:rgba(239,68,68,.2); border:1px solid rgba(239,68,68,.5); color:#fca5a5; }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">← 返回主页</a>
    <div class="container">
        <div class="module-nav">
            <a href="converter-approve.html" class="module-btn approve"><span class="icon">✅</span><span>过审</span></a>
            <a href="converter-reject.html" class="module-btn reject active"><span class="icon">✖</span><span>不过审</span></a>
        </div>

        <div class="upload-section" id="uploadSection">
            <h2>✖ 不过审数据转换工具</h2>
            <p>📂 拖拽 CSV/Excel 文件到此处上传</p>
            <div class="drag-hint">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(239,68,68,.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:15px auto;display:block;">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls">
                <label for="fileInput" class="file-label">📁 选择文件（CSV / Excel）</label>
            </div>
            <p style="margin-top:14px;font-size:.85em;color:rgba(255,255,255,.45)">支持 .csv / .xlsx / .xls 格式</p>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="stats-row" id="stats"></div>
            <div class="table-wrapper">
                <table><thead id="previewHead"></thead><tbody id="previewBody"></tbody></table>
            </div>
            <div class="pagination-wrapper" id="paginationWrapper" style="display:none;">
                <button class="page-btn" id="pagePrevBtn" onclick="pager.changePage(-1)">◀ 上一页</button>
                <span class="pagination-info" id="paginationInfo"></span>
                <button class="page-btn" id="pageNextBtn" onclick="pager.changePage(1)">下一页 ▶</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="startConvert()">⚡ 开始转换</button>
                <button class="btn btn-secondary" onclick="resetAll()">🔄 重新上传</button>
            </div>
        </div>
    </div>

    <div class="loader" id="loader"><div class="spinner"></div><div class="loader-text" id="loaderText">处理中...</div></div>
    <div class="notification" id="notification"></div>

<script>
    // ══════════════════════════════════════
    // 不过审页面：业务差异配置
    // ══════════════════════════════════════
    var OUTPUT_COLS = ['TimeStamp', 'dispute_task_id', 'feed_id', 'operator', '', 'evidence_text'];
    var OUTPUT_COLS_ZH = ['TimeStamp', 'dispute_task_id', 'feed_id', 'operator', '', 'evidence_text'];
    var EXPORT_FILE_PREFIX = '转换结果_不过审_';

    var parsedData = [];
    var pager = null;

    // ── 字段提取（不过审专属逻辑：多一个 operator + evidence_text 从 answer_data） ──
    function extractFields(rawRow) {
        var result = {
            TimeStamp: '',
            dispute_task_id: '',
            feed_id: '',
            operator: '',
            evidence_text: ''
        };

        // ✅ 修复 Bug 1：使用 DC.formatTimeStamp（正确正则 \d）
        result.TimeStamp = DC.formatTimeStamp((rawRow['TimeStamp'] || '').trim(), true); // keepTime=true 保留时分秒
        result.operator = (rawRow['operator'] || '').trim();

        var cd = (rawRow['content_data'] || '').trim();
        if (cd) {
            var fid = DC.extractFromStr(cd, 'feed_id');
            var tid = DC.extractFromStr(cd, 'dispute_task_id');
            var et  = DC.extractFromStr(cd, 'evidence_text');
            if (fid) result.feed_id = fid;
            if (tid) result.dispute_task_id = tid;
            if (et && !result.evidence_text) result.evidence_text = et;
        }

        var ad = (rawRow['answer_data'] || '').trim();
        if (ad) {
            if (!result.feed_id) {
                var fid2 = DC.extractFromStr(ad, 'feed_id');
                if (fid2) result.feed_id = fid2;
            }
            if (!result.dispute_task_id) {
                var tid2 = DC.extractFromStr(ad, 'dispute_task_id');
                if (tid2) result.dispute_task_id = tid2;
            }
            if (!result.evidence_text) {
                var et2 = DC.extractFromStr(ad, 'pruned_desc');
                if (et2) result.evidence_text = et2;
            }
        }

        return result;
    }

    // ── 文件处理 ──
    function handleFile(file) {
        DC.showLoader('正在读取 ' + file.name + '...');
        DC.readFile(file, function(err, data, ext) {
            DC.hideLoader();
            if (err) {
                DC.showNotification(err.message, 'error');
                return;
            }
            if (!data || data.length === 0) {
                DC.showNotification('⚠️ 未找到有效数据，请检查文件格式', 'error');
                return;
            }

            parsedData = data.map(extractFields).filter(function(r) { return r && r.TimeStamp; });

            if (parsedData.length === 0) {
                DC.showNotification('⚠️ 未找到有效数据，请检查文件格式', 'error');
                return;
            }

            displayPreview();
            document.getElementById('previewSection').classList.add('active');
            DC.showNotification('✅ 成功解析 ' + parsedData.length + ' 条数据');
        });
    }

    // ── 预览 ──
    function displayPreview() {
        DC.renderStats('stats', [
            { value: parsedData.length, label: '总数据量' },
            { value: parsedData.filter(function(r){ return r.dispute_task_id; }).length, label: '争议任务数' },
            { value: parsedData.filter(function(r){ return !r.feed_id || !r.dispute_task_id; }).length, label: '转化错误', error: true },
            { value: parsedData.filter(function(r){ return r.evidence_text; }).length, label: '含文本数据' }
        ]);

        document.getElementById('previewHead').innerHTML =
            '<tr>' + OUTPUT_COLS_ZH.map(function(c) { return '<th>' + DC.escapeHtml(c) + '</th>'; }).join('') + '</tr>';

        pager = DC.createPagination(parsedData, OUTPUT_COLS, {
            bodyEl: 'previewBody',
            infoEl: 'paginationInfo',
            prevBtn: 'pagePrevBtn',
            nextBtn: 'pageNextBtn',
            wrapperEl: 'paginationWrapper',
            maxCellLen: 50
        });
        pager.render();
    }

    // ── 导出 ──
    function startConvert() {
        if (!parsedData.length) { DC.showNotification('请先上传文件', 'error'); return; }
        DC.showLoader('正在生成 Excel 文件...');
        // 先确保 Excel 库就绪 → 导出成功后再提示；不再先报成功、不再人为延迟、不再自动清空（方便再次导出）
        DC.ensureXlsx().then(function () {
            // 文件名用本地日期（toISOString 是 UTC，北京时间 0~8 点会变成前一天）
            var fileName = EXPORT_FILE_PREFIX + DC.localDateStr() + '.xlsx';
            DC.exportToExcel(parsedData, OUTPUT_COLS, fileName);
            DC.hideLoader();
            DC.showNotification('✅ 已导出 ' + fileName + '（共 ' + parsedData.length + ' 条）');
        }).catch(function (err) {
            DC.hideLoader();
            DC.showNotification('转换失败：' + ((err && err.message) || err), 'error');
        });
    }

    function resetAll() {
        parsedData = [];
        document.getElementById('previewSection').classList.remove('active');
        document.getElementById('fileInput').value = '';
    }

    // ── 初始化 ──
    DC.setupDragDrop('uploadSection', handleFile);
    document.getElementById('fileInput').addEventListener('change', function() {
        if (this.files && this.files[0]) handleFile(this.files[0]);
    });
</script>
</body>
</html>
