<body>
<div data-omega-watermark data-omega-edit-ui style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483100;padding:4px 10px;font-family:inherit;font-size:11px;line-height:1;color:inherit;opacity:.4;letter-spacing:.5px;pointer-events:none;user-select:none;-webkit-user-select:none;">狍子AI · Omega 引擎生成</div>
    <a href="index.html" class="btn-back">← 返回主页</a>
    <div class="container">
        <div class="module-nav">
            <a href="converter-approve.html" class="module-btn approve"><span class="icon">✅</span><span>过审</span></a>
            <a href="converter-reject.html" class="module-btn reject active"><span class="icon">✖</span><span>不过审</span></a>

        </div>

        <div class="upload-section" id="uploadSection">
            <h2>✖ 不过审数据转换工具</h2>
            <p>📂 拖拽 CSV/Excel 文件到此处上传</p>
            <div class="drag-hint">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(239,68,68,.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:15px auto;display:block;">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls">
                <label for="fileInput" class="file-label">📁 选择文件（CSV / Excel）</label>

        <div class="preview-section" id="previewSection">

            </div>

            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="startConvert()">⚡ 开始转换</button>

<script>
    // ══════════════════════════════════════
    // 不过审页面：业务差异配置
    // ══════════════════════════════════════
    var OUTPUT_COLS = ['TimeStamp', 'dispute_task_id', 'feed_id', 'operator', '', 'evidence_text'];
    var OUTPUT_COLS_ZH = ['TimeStamp', 'dispute_task_id', 'feed_id', 'operator', '', 'evidence_text'];
    var EXPORT_FILE_PREFIX = '转换结果_不过审_';

    var parsedData = [];
    var pager = null;

    // ── 字段提取（不过审专属逻辑：多一个 operator + evidence_text 从 answer_data） ──
    function extractFields(rawRow) {
        var result = {
            TimeStamp: '',
            dispute_task_id: '',
            feed_id: '',
            operator: '',
            evidence_text: ''
        };

        // ✅ 修复 Bug 1：使用 DC.formatTimeStamp（正确正则 \d）
        result.TimeStamp = DC.formatTimeStamp((rawRow['TimeStamp'] || '').trim(), true); // keepTime=true 保留时分秒
        result.operator = (rawRow['operator'] || '').trim();

        var cd = (rawRow['content_data'] || '').trim();
        if (cd) {
            var fid = DC.extractFromStr(cd, 'feed_id');
            var tid = DC.extractFromStr(cd, 'dispute_task_id');
            var et  = DC.extractFromStr(cd, 'evidence_text');
            if (fid) result.feed_id = fid;
            if (tid) result.dispute_task_id = tid;
            if (et && !result.evidence_text) result.evidence_text = et;
        }

        var ad = (rawRow['answer_data'] || '').trim();
        if (ad) {
            if (!result.feed_id) {
                var fid2 = DC.extractFromStr(ad, 'feed_id');
                if (fid2) result.feed_id = fid2;
            }
            if (!result.dispute_task_id) {
                var tid2 = DC.extractFromStr(ad, 'dispute_task_id');
                if (tid2) result.dispute_task_id = tid2;
            }
            if (!result.evidence_text) {
                var et2 = DC.extractFromStr(ad, 'pruned_desc');
                if (et2) result.evidence_text = et2;
            }
        }

        return result;
    }

    // ── 文件处理 ──
    function handleFile(file) {
        DC.showLoader('正在读取 ' + file.name + '...');
        DC.readFile(file, function(err, data, ext) {
            DC.hideLoader();
            if (err) {
                DC.showNotification(err.message, 'error');
                return;
            }
            if (!data || data.length === 0) {
                DC.showNotification('⚠️ 未找到有效数据，请检查文件格式', 'error');
                return;
            }

            parsedData = data.map(extractFields).filter(function(r) { return r && r.TimeStamp; });

            if (parsedData.length === 0) {
                DC.showNotification('⚠️ 未找到有效数据，请检查文件格式', 'error');
                return;
            }

            displayPreview();
            document.getElementById('previewSection').classList.add('active');
            DC.showNotification('✅ 成功解析 ' + parsedData.length + ' 条数据');
        });
    }

    // ── 预览 ──
    function displayPreview() {
        DC.renderStats('stats', [
            { value: parsedData.length, label: '总数据量' },
            { value: parsedData.filter(function(r){ return r.dispute_task_id; }).length, label: '争议任务数' },
            { value: parsedData.filter(function(r){ return !r.feed_id || !r.dispute_task_id; }).length, label: '转化错误', error: true },
            { value: parsedData.filter(function(r){ return r.evidence_text; }).length, label: '含文本数据' }
        ]);

        document.getElementById('previewHead').innerHTML =
            '<tr>' + OUTPUT_COLS_ZH.map(function(c) { return '<th>' + DC.escapeHtml(c) + '</th>'; }).join('') + '</tr>';

        pager = DC.createPagination(parsedData, OUTPUT_COLS, {
            bodyEl: 'previewBody',
            infoEl: 'paginationInfo',
            prevBtn: 'pagePrevBtn',
            nextBtn: 'pageNextBtn',
            wrapperEl: 'paginationWrapper',
            maxCellLen: 50
        });
        pager.render();
    }

    // ── 导出 ──
    function startConvert() {
        DC.showLoader('正在生成 Excel 文件...');
        document.getElementById('previewSection').classList.remove('active');

        setTimeout(function() {
            try {
                var fileName = EXPORT_FILE_PREFIX + new Date().toISOString().slice(0, 10) + '.xlsx';
                // 先隐藏加载层、弹出成功提示，再触发下载（避免浏览器下载吞掉通知动画）
                DC.hideLoader();
                DC.showNotification('✅ 转换完成！正在下载 ' + fileName);
                DC.exportToExcel(parsedData, OUTPUT_COLS, fileName);
                setTimeout(resetAll, 3000);
            } catch(err) {
                DC.hideLoader();
                DC.showNotification('转换失败：' + err.message, 'error');
            }
        }, 800);
    }

    function resetAll() {
        parsedData = [];
        document.getElementById('previewSection').classList.remove('active');
        document.getElementById('fileInput').value = '';
    }

    // ── 初始化 ──
    DC.setupDragDrop('uploadSection', handleFile);
    document.getElementById('fileInput').addEventListener('change', function() {
        if (this.files && this.files[0]) handleFile(this.files[0]);
    });
</script>

<script data-omega-edit-layer>
(function(){
  var W=window;var NS=W.__OMEGA__=W.__OMEGA__||{};
  if(NS.__editLayerReady)return;NS.__editLayerReady=true;
  // 不可改字的标签（媒体/脚本/表单控件/矢量）：这些没有「直接可读文本」语义,或编辑会破坏结构。
  var SKIP_TAGS={SCRIPT:1,STYLE:1,NOSCRIPT:1,SVG:1,CANVAS:1,IMG:1,IFRAME:1,VIDEO:1,AUDIO:1,SELECT:1,TEXTAREA:1,INPUT:1,BR:1,HR:1};
  // 元素是否拥有「直接文本节点」（非空白）。这是「全部文字可改」的核心判据——
  // 不再靠标签白名单（div/section 里的正文同样命中），与 frontend-slides 一致。
  function hasOwnText(el){
    var ns=el.childNodes;
    for(var i=0;i<ns.length;i++){var c=ns[i];if(c.nodeType===3&&c.nodeValue&&c.nodeValue.replace(/\s+/g,'').length)return true;}
    return false;
  }
  var editing=false,hideTimer=null;
  var hot=document.createElement('div');hot.className='omega-edit-hotzone';hot.setAttribute('data-omega-edit-ui','');document.body.appendChild(hot);
  var toggle=document.createElement('button');toggle.className='omega-edit-toggle';toggle.textContent='\u270e';toggle.title='编辑 (E)';toggle.setAttribute('data-omega-edit-ui','');document.body.appendChild(toggle);
  var flash=document.createElement('div');flash.className='omega-edit-flash';flash.setAttribute('data-omega-edit-ui','');document.body.appendChild(flash);
  function showToggle(){if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}toggle.classList.add('is-visible');}
  // 用 JS + 400ms 宽限,不用 CSS ~ 兄弟选择器:按钮 pointer-events 会断 hover 链。
  function scheduleHide(){if(editing)return;hideTimer=setTimeout(function(){toggle.classList.remove('is-visible');},400);}
  hot.addEventListener('mouseenter',showToggle);hot.addEventListener('mouseleave',scheduleHide);
  toggle.addEventListener('mouseenter',showToggle);toggle.addEventListener('mouseleave',scheduleHide);
  function setEditable(on){editing=on;NS.editing=on;toggle.classList.toggle('is-editing',on);document.body.classList.toggle('omega-editing',on);if(on){showToggle();}else{scheduleHide();}
    if(!on){Array.prototype.forEach.call(document.body.querySelectorAll('[contenteditable="true"]'),function(el){el.removeAttribute('contenteditable');});return;}
    var els=document.body.querySelectorAll('*');
    Array.prototype.forEach.call(els,function(el){
      if(SKIP_TAGS[el.tagName])return;
      if(el.closest('[data-omega-edit-ui]'))return;
      if(el.closest('svg'))return;
      // 动态区(运行时数据驱动的图表/数字:data-query-id;或显式标注 data-omega-dynamic)不可内联改字——
      // 「改了白改」(下次查询刷回),且改后无法回写到数据源。编辑态仅给视觉提示(见 .omega-editing 样式)。
      if(el.closest('[data-omega-dynamic],[data-query-id]'))return;
      // 自身无直接文本 → 跳过(纯布局容器,其文本子节点会各自命中)。
      if(!hasOwnText(el))return;
      // 祖先已可编辑 → 跳过:contenteditable 向下级联,避免重复虚线框与嵌套编辑冲突。
      // 文档序遍历保证祖先先于后代被标记,故只需看 parentElement.closest。
      if(el.parentElement&&el.parentElement.closest('[contenteditable="true"]'))return;
      el.setAttribute('contenteditable','true');});}
  function flashMsg(t){flash.textContent=t;flash.classList.add('is-show');setTimeout(function(){flash.classList.remove('is-show');},1200);}
  NS.flashMsg=flashMsg;
  // 序列化整份文档:剥编辑态 + 删运行期 UI + deck 还原钩子。回写唯一真相源 = HTML。
  function serialize(){
    var root=document.documentElement.cloneNode(true);
    Array.prototype.forEach.call(root.querySelectorAll('[data-omega-edit-ui]'),function(e){if(e.parentNode)e.parentNode.removeChild(e);});
    Array.prototype.forEach.call(root.querySelectorAll('[contenteditable]'),function(e){e.removeAttribute('contenteditable');});
    // 动态数据容器(data-query-id)清空已渲染图表 DOM(echarts canvas 等):重载时 loadData() 会重新渲染。
    // 否则冻结的图表 DOM 会让二次 echarts.init 在同一容器叠加/损坏(重载双重渲染)。仅改克隆,不动 live 文档。
    Array.prototype.forEach.call(root.querySelectorAll('[data-query-id]'),function(e){e.innerHTML='';});
    Array.prototype.forEach.call(root.querySelectorAll('.omega-editing'),function(e){e.classList.remove('omega-editing');});
    if(typeof NS.normalizeSerializedRoot==='function'){try{NS.normalizeSerializedRoot(root);}catch(_e){}}
    return '<!DOCTYPE html>\n'+root.outerHTML;
  }
  function save(){
    var html=serialize();
    if(W.parent&&W.parent!==W){try{W.parent.postMessage({type:'omega:artifact-edit',html:html},'*');}catch(_e){}flashMsg('已保存');return;}
    try{var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=(document.title||'omega')+'.html';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);flashMsg('已下载');}catch(_e){flashMsg('保存失败');}
  }
  NS.save=save;
  toggle.addEventListener('click',function(){setEditable(!editing);});
  window.addEventListener('keydown',function(e){
    var t=e.target||{};var tag=(t.tagName||'').toUpperCase();
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();save();return;}
    if(t.isContentEditable||tag==='INPUT'||tag==='TEXTAREA')return;
    if(e.key==='e'||e.key==='E'){setEditable(!editing);}
  });
})();
</script>
</body>
