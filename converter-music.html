<script>
    // ══════════════════════════════════════
    // 音乐页面：两文件合并 + 争议筛选
    // ══════════════════════════════════════
    var OUTPUT_COLS = ['标注时间', 'feed_id', '题目ID', '标注员', '标注结果'];
    var EXPORT_FILE_PREFIX = '转换结果_音乐_';

    var file1Data = [];
    var file2Data = [];
    var parsedData = [];
    var currentStep = 1;
    var pager = null;

    // ✅ 修复 M6：用字符串方式还原科学计数法，避免 parseFloat 精度丢失
    // 例如 "1.234567890123456e19" → "12345678901234560000"（保留所有精度）
    function expandScientificNotation(str) {
        str = String(str).trim().toLowerCase();
        var parts = str.split('e');
        if (parts.length !== 2) return str;
        var mantissa = parts[0];
        var exponent = parseInt(parts[1], 10);
        if (isNaN(exponent)) return str;
        // 处理小数点
        var dotIdx = mantissa.indexOf('.');
        var intPart = dotIdx >= 0 ? mantissa.slice(0, dotIdx) : mantissa;
        var fracPart = dotIdx >= 0 ? mantissa.slice(dotIdx + 1) : '';
        var digits = intPart + fracPart;
        if (exponent >= 0) {
            // 正指数：向右补零
            var neededZeros = exponent - fracPart.length;
            if (neededZeros > 0) {
                digits += Array(neededZeros + 1).join('0');
            } else if (neededZeros < 0) {
                // 小数部分比指数长，需要插入小数点
                digits = digits.slice(0, intPart.length + exponent) + '.' + digits.slice(intPart.length + exponent);
            }
        } else {
            // 负指数：向左补零
            var neededZeros = Math.abs(exponent) - intPart.length;
            if (neededZeros > 0) {
                digits = '0.' + Array(neededZeros + 1).join('0') + digits;
            } else {
                digits = digits.slice(0, -Math.abs(exponent)) + '.' + digits.slice(-Math.abs(exponent));
            }
        }
        // 去除尾部多余的 .0
        return digits.replace(/\.0+$/, '').replace(/^0+(?=\d)/, '');
    }

    // ── 字段提取（音乐专属：feed_id 支持扁平列 + 科学计数法） ──
    function extractFeedId(row) {
        var allKeys = Object.keys(row);

        // 1. 精确匹配扁平列
        var exactFeedCols = ['content_data.content.feed_id', 'content_data.content.feedid', 'feed_id', 'FeedId', 'feedID'];
        for (var i = 0; i < exactFeedCols.length; i++) {
            var v = String(row[exactFeedCols[i]] || '').trim();
            if (v && v !== 'nan' && v !== 'NaN' && v !== 'undefined') {
                // ✅ 修复 M6：用字符串方式还原科学计数法，避免 parseFloat 精度丢失
                if (v.indexOf('e') !== -1 || v.indexOf('E') !== -1) {
                    v = expandScientificNotation(v);
                }
                return v;
            }
        }

        // 2. 包含 feed_id 的列（排除干扰字段）
        var skipPatterns = ['ilabel', 'from_mid'];
        for (var i = 0; i < allKeys.length; i++) {
            var k = allKeys[i];
            var shouldSkip = false;
            for (var s = 0; s < skipPatterns.length; s++) {
                if (k.indexOf(skipPatterns[s]) !== -1) { shouldSkip = true; break; }
            }
            if (shouldSkip) continue;
            if ((k.indexOf('feed_id') !== -1 || k === 'feedId' || k === 'feed.id') && row[k]) {
                var v = String(row[k]).trim();
                if (v && v !== 'nan' && v !== 'NaN') return v;
            }
        }

        // 3. JSON 字符串搜索
        var cd = (row['content_data'] || '').trim();
        if (cd) { var fid = DC.extractFromStr(cd, 'feed_id'); if (fid) return fid; }
        var ad = (row['answer_data'] || '').trim();
        if (ad) { var fid2 = DC.extractFromStr(ad, 'feed_id'); if (fid2) return fid2; }

        return '';
    }

    function extractLabel(row) {
        var allKeys = Object.keys(row);
        var exactNames = ['content.key_result_label', 'key_result_label', '标注结果'];
        for (var i = 0; i < exactNames.length; i++) {
            var v = String(row[exactNames[i]] || '').trim();
            if (v) return v;
        }

        var skipPatterns = ['ilabel', 'from_mid', 'parent_hid', 'action_name', 'model_listen_id', 'listen_id'];
        for (var i = 0; i < allKeys.length; i++) {
            var k = allKeys[i];
            var shouldSkip = false;
            for (var s = 0; s < skipPatterns.length; s++) {
                if (k.indexOf(skipPatterns[s]) !== -1) { shouldSkip = true; break; }
            }
            if (shouldSkip) continue;
            if (k === 'key_result_label' || k === 'result_label' ||
                k.endsWith('.key_result_label') || k.endsWith('.result_label') ||
                k.endsWith('_key_result_label') || k.endsWith('_result_label')) {
                var v = String(row[k] || '').trim();
                if (v && v !== 'nan' && v !== 'NaN') return v;
            }
        }

        var cd = (row['content_data'] || '').trim();
        if (cd) { var label = DC.extractFromStr(cd, 'key_result_label') || DC.extractFromStr(cd, 'result_label'); if (label) return label; }
        var ad = (row['answer_data'] || '').trim();
        if (ad) { var label2 = DC.extractFromStr(ad, 'key_result_label') || DC.extractFromStr(ad, 'result_label'); if (label2) return label2; }
        return '';
    }

    function extractTime(row) {
        var timeKeys = ['TimeStamp', 'timestamp', '标注时间', 'time', '创建时间'];
        for (var i = 0; i < timeKeys.length; i++) {
            var v = (row[timeKeys[i]] || '').trim();
            if (v) return DC.formatTimeStamp(v);
        }
        var allKeys = Object.keys(row);
        for (var i = 0; i < allKeys.length; i++) {
            var k = allKeys[i].toLowerCase();
            if (k.indexOf('time') !== -1 || k.indexOf('日期') !== -1 || k === 'timestamp') {
                var v = (row[allKeys[i]] || '').trim();
                if (v) return DC.formatTimeStamp(v);
            }
        }
        return '';
    }

    function extractTaskId(row) {
        var taskKeys = ['dispute_task_id', 'task_id', 'taskid', 'taskId', '题目ID', '任务ID'];
        for (var i = 0; i < taskKeys.length; i++) {
            var v = String(row[taskKeys[i]] || '').trim();
            if (v) return v;
        }
        var allKeys = Object.keys(row);
        for (var i = 0; i < allKeys.length; i++) {
            if (allKeys[i].indexOf('task') !== -1 || allKeys[i] === '题目ID') {
                var v = String(row[allKeys[i]] || '').trim();
                if (v) return v;
            }
        }
        var cd = (row['content_data'] || '').trim();
        if (cd) { var tid = DC.extractFromStr(cd, 'dispute_task_id'); if (tid) return tid; }
        var ad = (row['answer_data'] || '').trim();
        if (ad) { var tid2 = DC.extractFromStr(ad, 'dispute_task_id'); if (tid2) return tid2; }
        return '';
    }

    function extractAnnotator(row) {
        var opKeys = ['operator', 'Operator', 'opr', 'opr_name', '标注员', '标注人', '处理人'];
        for (var i = 0; i < opKeys.length; i++) {
            var v = (row[opKeys[i]] || '').trim();
            if (v) return v;
        }
        var allKeys = Object.keys(row);
        for (var i = 0; i < allKeys.length; i++) {
            var k = allKeys[i];
            if (k.indexOf('标注员') !== -1 || k.indexOf('operator') !== -1 || k.indexOf('opr') !== -1) {
                var v = (row[k] || '').trim();
                if (v) return v;
            }
        }
        return '';
    }

    // ── 文件处理 ──
    function handleFile(file) {
        DC.showLoader('正在读取 ' + file.name + '...');
        DC.readFile(file, function(err, data, ext) {
            DC.hideLoader();
            if (err) {
                DC.showNotification(err.message, 'error');
                return;
            }
            if (!data || data.length === 0) {
                DC.showNotification('⚠️ 未找到有效数据', 'error');
                return;
            }

            if (currentStep === 1) {
                file1Data = data;
                document.getElementById('uploadedInfo').innerHTML =
                    '<span>✅ 文件1：' + DC.escapeHtml(file.name) + '（' + data.length + ' 条）</span>' +
                    '<button class="remove-file" onclick="removeFile1()">删除</button>';
                document.getElementById('uploadedInfo').style.display = '';
                document.getElementById('fileLabel').style.display = 'none';
                DC.showNotification('✅ 文件1 已加载：' + data.length + ' 条，请继续上传文件2');

                currentStep = 2;
                updateStepUI();
                document.getElementById('uploadPrompt').textContent = '📂 拖拽或选择第二个 CSV / Excel 文件';
                document.getElementById('fileInput').value = '';
            } else if (currentStep === 2) {
                file2Data = data;
                document.getElementById('uploadedInfo').innerHTML +=
                    '<br><span style="margin-top:6px;display:inline-block;">✅ 文件2：' + DC.escapeHtml(file.name) + '（' + data.length + ' 条）</span>';
                DC.showNotification('✅ 文件2已加载：' + data.length + ' 条，正在自动筛选...');

                currentStep = 3;
                updateStepUI();
                setTimeout(filterAndMerge, 300);
            }
        });
    }

    // ✅ 修复 Bug 5：removeFile1 只清文件1，回退到步骤1
    function removeFile1() {
        file1Data = [];
        file2Data = [];
        parsedData = [];
        currentStep = 1;
        document.getElementById('uploadedInfo').style.display = 'none';
        document.getElementById('uploadedInfo').innerHTML = '';
        document.getElementById('fileLabel').style.display = '';
        document.getElementById('uploadPrompt').textContent = '📂 拖拽或选择第一个 CSV / Excel 文件';
        document.getElementById('fileInput').value = '';
        document.getElementById('previewSection').classList.remove('active');
        updateStepUI();
    }

    function updateStepUI() {
        var s1 = document.getElementById('step1Item');
        var s2 = document.getElementById('step2Item');
        var s3 = document.getElementById('step3Item');
        s1.className = 'step-item' + (currentStep >= 1 ? (file1Data.length > 0 ? ' done' : ' active') : '');
        s2.className = 'step-item' + (currentStep >= 2 ? (file2Data.length > 0 ? ' done' : ' active') : '');
        s3.className = 'step-item' + (currentStep >= 3 ? (parsedData.length > 0 ? ' done' : ' active') : '');
    }

    // ── 合并两个文件并筛选争议数据 ──
    function filterAndMerge() {
        DC.showLoader('正在合并并筛选争议数据...');

        setTimeout(function() {
            try {
                var merged = file1Data.concat(file2Data);

                var feedMap = {};
                for (var i = 0; i < merged.length; i++) {
                    var row = merged[i];
                    var feedId = extractFeedId(row);
                    if (!feedId) continue;
                    if (!feedMap[feedId]) feedMap[feedId] = [];
                    feedMap[feedId].push({
                        raw: row,
                        feedId: feedId,
                        label: extractLabel(row),
                        time: extractTime(row),
                        taskId: extractTaskId(row),
                        annotator: extractAnnotator(row)
                    });
                }

                parsedData = [];
                var feedIds = Object.keys(feedMap);
                for (var f = 0; f < feedIds.length; f++) {
                    var items = feedMap[feedIds[f]];
                    var labels = {};
                    for (var i = 0; i < items.length; i++) labels[items[i].label] = true;
                    var uniqueLabels = Object.keys(labels).filter(function(l) { return l; });

                    if (uniqueLabels.length > 1) {
                        for (var i = 0; i < items.length; i++) {
                            parsedData.push({
                                '标注时间': items[i].time,
                                'feed_id': items[i].feedId,
                                '题目ID': items[i].taskId,
                                '标注员': items[i].annotator,
                                '标注结果': items[i].label
                            });
                        }
                    }
                }

                DC.hideLoader();
                updateStepUI();

                if (parsedData.length === 0) {
                    DC.showNotification('⚠️ 未找到争议数据（需要同一 feed_id 下有不同的标注结果）', 'error');
                    return;
                }

                displayPreview();
                document.getElementById('previewSection').classList.add('active');
                DC.showNotification('✅ 筛选完成！共 ' + parsedData.length + ' 条争议记录');
            } catch(err) {
                DC.hideLoader();
                DC.showNotification('处理失败：' + err.message, 'error');
            }
        }, 400);
    }

    // ── 预览 ──
    function displayPreview() {
        DC.renderStats('stats', [
            { value: file1Data.length + file2Data.length, label: '合并总行数' },
            { value: parsedData.length, label: '争议记录数' },
            { value: parsedData.filter(function(r){ return !r['feed_id'] || !r['标注结果']; }).length, label: '转化错误', error: true }
        ]);

        document.getElementById('previewHead').innerHTML =
            '<tr>' + OUTPUT_COLS.map(function(c) { return '<th>' + DC.escapeHtml(c) + '</th>'; }).join('') + '</tr>';

        pager = DC.createPagination(parsedData, OUTPUT_COLS, {
            bodyEl: 'previewBody',
            infoEl: 'paginationInfo',
            prevBtn: 'pagePrevBtn',
            nextBtn: 'pageNextBtn',
            wrapperEl: 'paginationWrapper',
            maxCellLen: 60
        });
        pager.render();
    }

    // ── 导出 ──
    function startConvert() {
        DC.showLoader('正在生成 Excel 文件...');
        document.getElementById('previewSection').classList.remove('active');

        setTimeout(function() {
            try {
                // 按 feed_id 分组，组间插入空行
                var aoa = [];
                // 表头行
                aoa.push(OUTPUT_COLS.slice());

                var lastFeedId = null;
                for (var i = 0; i < parsedData.length; i++) {
                    var row = parsedData[i];
                    var feedId = String(row['feed_id'] || '').trim();

                    // feed_id 变化时插入空行（全空数组）
                    if (lastFeedId !== null && feedId !== lastFeedId) {
                        var emptyRow = [];
                        for (var c = 0; c < OUTPUT_COLS.length; c++) emptyRow.push('');
                        aoa.push(emptyRow);
                    }

                    // 数据行
                    var dataRow = [];
                    for (var c = 0; c < OUTPUT_COLS.length; c++) {
                        dataRow.push(row[OUTPUT_COLS[c]] || '');
                    }
                    aoa.push(dataRow);

                    lastFeedId = feedId;
                }

                // 用 XLSX 直接写入（aoa = array of arrays）
                var ws = XLSX.utils.aoa_to_sheet(aoa);
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '争议数据');

                var fileName = EXPORT_FILE_PREFIX + new Date().toISOString().slice(0, 10) + '.xlsx';
                XLSX.writeFile(wb, fileName);

                DC.hideLoader();
                DC.showNotification('✅ 转换完成！已下载 ' + fileName);
                setTimeout(resetAll, 3000);
            } catch(err) {
                DC.hideLoader();
                DC.showNotification('转换失败：' + err.message, 'error');
            }
        }, 800);
    }

    function resetAll() {
        file1Data = [];
        file2Data = [];
        parsedData = [];
        currentStep = 1;
        document.getElementById('previewSection').classList.remove('active');
        document.getElementById('fileInput').value = '';
        document.getElementById('uploadedInfo').style.display = 'none';
        document.getElementById('uploadedInfo').innerHTML = '';
        document.getElementById('fileLabel').style.display = '';
        document.getElementById('uploadPrompt').textContent = '📂 拖拽或选择第一个 CSV / Excel 文件';
        updateStepUI();
    }

    // ── 初始化 ──
    DC.setupDragDrop('uploadSection', handleFile);
    document.getElementById('fileInput').addEventListener('change', function() {
        if (this.files && this.files[0]) handleFile(this.files[0]);
    });
</script><style data-omega-edit-layer>

<script data-omega-edit-layer>

      // 「改了白改」(下次查询刷回),且改后无法回写到数据源。编辑态仅给视觉提示(见 .omega-editing 样式)。
      if(el.closest('[data-omega-dynamic],[data-query-id]'))return;

  function serialize(){

    Array.prototype.forEach.call(root.querySelectorAll('[data-query-id]'),function(e){e.innerHTML='';});

  }

  });
