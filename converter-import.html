<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导入工具</title>
    <script src="./xlsx.full.min.js"></script>
    <script src="common.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        html { min-width: 1400px; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%);
            color: #fff;
            min-height: 100vh;
            min-width: 1400px;
            overflow-x: auto;
            position: relative;
        }
        .container { position:relative; z-index:10; width:1400px; min-width:auto; max-width:1400px; margin:0 auto; padding:40px; }
        .page-intro { text-align:center; margin-bottom:32px; animation:fadeInDown .5s ease-out both; }
        .page-intro h2 { font-size:1.8em; font-weight:800; letter-spacing:2px; background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:12px; }
        .page-intro p { font-size:1.05em; color:rgba(255,255,255,.55); letter-spacing:1px; }
        .upload-section { background:rgba(255,255,255,.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:40px; margin-bottom:28px; animation:fadeInUp .6s ease-out both; }
        .upload-zone { border:2px dashed rgba(255,255,255,.2); border-radius:16px; padding:60px 40px; text-align:center; cursor:pointer; transition:all .35s; position:relative; }
        .upload-zone:hover, .upload-zone.drag-over { border-color:rgba(251,146,60,.6); background:rgba(251,146,60,.06); }
        .upload-icon { font-size:3.5em; margin-bottom:16px; opacity:.7; }
        .upload-text { font-size:1.1em; color:rgba(255,255,255,.7); margin-bottom:8px; }
        .upload-hint { font-size:.85em; color:rgba(255,255,255,.35); }
        .upload-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .table-section { background:rgba(255,255,255,.06); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:28px; overflow-x:auto; animation:fadeInUp .6s ease-out .15s both; display:none; }
        .table-section.visible { display:block; }
        .section-title { font-size:1.1em; font-weight:700; color:rgba(255,255,255,.9); margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .section-title .count { background:rgba(251,146,60,.2); color:#fb923c; font-size:.75em; padding:3px 12px; border-radius:20px; font-weight:600; }
        table { width:100%; border-collapse:collapse; min-width:900px; }
        th { background:rgba(255,255,255,.06); padding:14px 18px; text-align:left; font-weight:600; font-size:.88em; color:rgba(255,255,255,.6); border-bottom:1px solid rgba(255,255,255,.08); letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; }
        td { padding:13px 18px; border-bottom:1px solid rgba(255,255,255,.04); font-size:.9em; color:rgba(255,255,255,.8); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        tr:hover td { background:rgba(255,255,255,.04); }
        .action-bar { display:flex; justify-content:center; gap:20px; margin-top:28px; animation:fadeInUp .6s ease-out .3s both; }
        .btn { padding:16px 48px; border-radius:50px; font-size:1.1em; font-weight:700; cursor:pointer; transition:all .35s cubic-bezier(.16,1,.3,1); border:2px solid transparent; letter-spacing:1px; }
        .btn-import { background: linear-gradient(135deg, #0f0f12 0%, #18181b 50%, #1c1c1f 100%); color:#fff; box-shadow:0 10px 40px rgba(251,146,60,.4); }
        .btn-import:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 14px 50px rgba(251,146,60,.55); }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
        .notification { position:fixed; top:30px; right:30px; padding:16px 30px; border-radius:14px; font-size:1em; font-weight:600; z-index:10000; transform:translateX(120%); transition:transform .4s cubic-bezier(.16,1,.3,1); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
        .notification.show { transform:translateX(0); }
        .notification.success { background:rgba(16,185,129,.2); border:1px solid rgba(16,185,129,.5); color:#6ee7b7; }
        .notification.error { background:rgba(239,68,68,.2); border:1px solid rgba(239,68,68,.5); color:#fca5a5; }
        .notification.info { background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.5); color:#93c5fd; }
        .btn-back { position:fixed; top:24px; left:24px; z-index:100; display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:50px; font-size:.95em; font-weight:600; text-decoration:none; background:rgba(255,255,255,.08); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.88); transition:all .3s; }
        .btn-back:hover { background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
        @media (max-width: 1500px) { .container { width:100%; min-width:auto; padding:30px 24px; } }
    </style>
</head>
<body>
<a href="index.html" class="btn-back">← 返回主页</a>
<div class="container">
    <div class="notification" id="notification"></div>

    <div class="page-intro">
        <h2>📥 数据导入</h2>
        <p>上传班表即可在主页展示</p>
    </div>

    <div class="upload-section">
        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.txt" />
            <div class="upload-icon">📥</div>
            <div class="upload-text">点击或拖拽文件到此处上传</div>
            <div class="upload-hint">支持 .csv / .xlsx / .xls / .txt 格式</div>
        </div>
    </div>

    <div class="table-section" id="table-section">
        <div class="section-title">
            📋 数据预览
            <span class="count" id="row-count">0 条</span>
        </div>
        <table id="data-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="action-bar">
        <button class="btn btn-import" id="btn-import" style="display:none;" onclick="doImport()">开始导入</button>
    </div>
</div>

<script>
    var zone = document.getElementById('upload-zone');
    var fileInput = document.getElementById('file-input');
    var importedData = [];

    // 全局阻止浏览器默认拖放行为（否则文件会被直接下载）
    // 子页面每次进入都会重新执行本脚本，全局监听只挂一次，避免越积越多
    if (!window.__dqsImportDropGuard) {
        window.__dqsImportDropGuard = true;
        document.addEventListener('dragover', function(e) { e.preventDefault(); });
        document.addEventListener('drop', function(e) { e.preventDefault(); });
    }

    // 仅在上传区域内处理文件拖放
    zone.addEventListener('dragover', function(e) {
        e.preventDefault();
        zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', function(e) {
        // 只有真正离开区域时才移除高亮
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', function(e) {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', function() {
        if (this.files.length) handleFile(this.files[0]);
    });

    function renderTable(data) {
        var head = document.getElementById('table-head');
        var body = document.getElementById('table-body');
        if (!data.length) return;
        var keys = Object.keys(data[0]);
        head.innerHTML = '';
        var tr = document.createElement('tr');
        keys.forEach(function(k) {
            var th = document.createElement('th');
            th.textContent = k;
            tr.appendChild(th);
        });
        head.appendChild(tr);
        body.innerHTML = '';
        data.forEach(function(row) {
            var tr = document.createElement('tr');
            keys.forEach(function(k) {
                var v = row[k];
                if (v === null || v === undefined) v = '';
                else if (typeof v === 'object') { try { v = JSON.stringify(v); } catch(ex) { v = String(v); } }
                else v = String(v);
                var td = document.createElement('td');
                td.textContent = v;
                td.title = v;
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
        document.getElementById('table-section').classList.add('visible');
        document.getElementById('btn-import').style.display = 'inline-block';
        document.getElementById('row-count').textContent = data.length + ' 条';
    }

    var MAX_FILE_SIZE = 10 * 1024 * 1024;

    function handleFile(file) {
        var ext = file.name.split('.').pop().toLowerCase();
        if (!['csv','xlsx','xls','txt'].includes(ext)) {
            DC.showNotification('❌ 请上传 CSV / Excel 文件', 'error'); return;
        }
        if (file.size > MAX_FILE_SIZE) {
            DC.showNotification('❌ 文件过大（最大 10MB）', 'error'); return;
        }

        var reader = new FileReader();
        DC.showNotification('⏳ 正在解析文件...', 'info');

        reader.onload = function(e) {
            try {
                var workbook;

                // ✅ 修复 Bug 2：CSV/TXT 用字符串解析，Excel 用 ArrayBuffer
                // 注意：不能用 raw:true，否则日期列会变成 Excel 序号数字而非日期字符串
                if (ext === 'csv' || ext === 'txt') {
                    // 二进制读入后识别 UTF-8 / GBK（中文 Excel 另存的 CSV 多为 GBK，直接按 UTF-8 读会乱码）
                    workbook = XLSX.read(DC.decodeText(e.target.result), { type: 'string' });
                } else {
                    var data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }

                var sheetName = workbook.SheetNames[0];
                var sheet = workbook.Sheets[sheetName];

                // 处理合并单元格：把合并区域的值填充到所有单元格
                if (sheet['!merges']) {
                    sheet['!merges'].forEach(function(m) {
                        var addr = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
                        var val = sheet[addr] ? sheet[addr].v : '';
                        for (var r = m.s.r; r <= m.e.r; r++) {
                            for (var c = m.s.c; c <= m.e.c; c++) {
                                var a = XLSX.utils.encode_cell({ r: r, c: c });
                                if (!sheet[a]) sheet[a] = { t: 's', v: val };
                                else if (r === m.s.r && c === m.s.c) continue;
                                else sheet[a].v = val;
                            }
                        }
                    });
                }

                var jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });

                // 尝试解析嵌套 JSON 字段
                jsonData = jsonData.map(function(row) {
                    Object.keys(row).forEach(function(key) {
                        if (typeof row[key] === 'string') {
                            var s = row[key].trim();
                            if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
                                try { row[key] = JSON.parse(s); } catch(ex) {}
                            }
                        }
                    });
                    return row;
                });

                if (!jsonData || !jsonData.length) {
                    DC.showNotification('❌ 文件内容为空', 'error'); return;
                }

                // ═══ 核心处理：班表格式 ═══
                var dateRow = jsonData[0];

                // 建立 列key → 日期字符串 的映射
                // 兼容多种日期格式：X月X日、ISO日期(YYYY-MM-DD)、Excel日期串等
                var colKeyToDate = {};
                var allKeys = Object.keys(dateRow);
                var datePatterns = [
                    /\d+\s*月\s*\d+\s*[日号]/,           // 6月3日 / 6月3号 / 6 月 3 日
                    /\d{1,2}[\/\-\.]\d{1,2}/,            // 6/3 / 6-3 / 6.3
                    /\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2}/ // 2024/6/3 / 2024-06-21（含时间后缀也匹配）
                ];
                function looksLikeDate(val) {
                    if (!val && val !== 0) return false;
                    // ✅ Date 对象直接识别为日期（Excel 原生日期单元格）
                    if (val instanceof Date && !isNaN(val)) return true;
                    var s = String(val).trim();
                    for (var pi = 0; pi < datePatterns.length; pi++) {
                        if (datePatterns[pi].test(s)) return true;
                    }
                    return false;
                }
                for (var di = 0; di < allKeys.length; di++) {
                    var dk = allKeys[di];
                    var rawVal = dateRow[dk];

                    // ✅ 修复核心 Bug（上传即报错）：当 Excel 表头单元格本身被设置为
                    // 「日期」格式时（例如班表首行从第4列起就是日期单元格，显示为"6月21日"），
                    // sheet_to_json 会直接把格式化后的日期文本当作列名（key）使用，
                    // 日期信息出现在 key 上而不会出现在下一行的取值(rawVal)里，
                    // 导致原逻辑永远检测不到日期列，从而误报"未检测到日期列"并中断上传。
                    // 因此这里优先检查列名本身是否为日期格式。
                    if (looksLikeDate(dk)) {
                        colKeyToDate[dk] = String(dk).trim();
                        continue;
                    }

                    if (!looksLikeDate(rawVal)) continue;
                    // 格式化日期值：Date对象→YYYY-MM-DD，字符串则清理时间后缀
                    var dVal;
                    if (rawVal instanceof Date) {
                        var m = rawVal.getMonth() + 1;
                        var d = rawVal.getDate();
                        dVal = rawVal.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
                    } else {
                        dVal = String(rawVal).trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\.\d+)?$/, '').replace(/T\d{2}:\d{2}(:\d{2})?(\.\d+)?Z?$/, '');
                    }
                    colKeyToDate[dk] = dVal;
                }

                // ✅ 修复 Bug 6：数据校验 — 没有日期列说明不是班表
                var dateColCount = Object.keys(colKeyToDate).length;
                if (dateColCount === 0) {
                    DC.showNotification('❌ 未检测到日期列（X月X日），请确认上传的是班表文件', 'error'); return;
                }

                // 智能姓名列识别：按行0的值内容匹配，不依赖 _1/_2 等硬编码 key
                // 兼容合并表头退化为 "排班原则..._1" / "__EMPTY" 等各种情况
                var NAME_COL_MAP = [
                    { hints: ['英文名','英文','English'], target: '英文名' },
                    { hints: ['中文名','中文','Chinese','企业名'], target: '中文名' },
                    { hints: ['企业名','公司','Company'],   target: '企业名' }
                ];
                for (var ni = 0; ni < allKeys.length; ni++) {
                    var nk = allKeys[ni];
                    if (colKeyToDate[nk]) continue; // 已映射（日期列）跳过
                    var nVal = String(dateRow[nk] || '').trim();
                    if (!nVal) continue;
                    for (var nh = 0; nh < NAME_COL_MAP.length; nh++) {
                        var group = NAME_COL_MAP[nh];
                        for (var hi = 0; hi < group.hints.length; hi++) {
                            // 同时检查 key 名和行0值，覆盖两种情况
                            if (nVal.indexOf(group.hints[hi]) >= 0 || nk.indexOf(group.hints[hi]) >= 0) {
                                colKeyToDate[nk] = group.target;
                                break;
                            }
                        }
                        if (colKeyToDate[nk]) break;
                    }
                }

                var dataRows = jsonData.slice(1);

                // 过滤备注行（用已建立的 colKeyToDate 找姓名列）
                var cleanRows = [];
                // 找到映射为"英文名"/含英文的原始key
                var engRawKey = null;
                for (var mk in colKeyToDate) {
                    if (colKeyToDate[mk] === '英文名' || mk.indexOf('英文') >= 0) { engRawKey = mk; break; }
                }
                for (var ci = 0; ci < dataRows.length; ci++) {
                    var row = dataRows[ci];
                    var firstNameVal = '';
                    if (engRawKey) firstNameVal = String(row[engRawKey] || '').trim();
                    if (!firstNameVal) {
                        // fallback：遍历所有key找第一个看起来像名字的列
                        for (var fk in row) {
                            if (fk === '_1' || fk === '__EMPTY_1' || fk.indexOf('英文') >= 0 || colKeyToDate[fk] === '英文名') {
                                firstNameVal = String(row[fk] || '').trim(); break;
                            }
                        }
                    }
                    if (firstNameVal && firstNameVal.indexOf('备注') >= 0) continue;
                    cleanRows.push(row);
                }

                // 替换 key
                var finalData = cleanRows.map(function(row) {
                    var newRow = {};
                    for (var k in row) {
                        var newKey = colKeyToDate[k] || k;
                        newRow[newKey] = row[k];
                    }
                    return newRow;
                });

                // 日期列统一成带年份的 YYYY-MM-DD（「11月21日」这类没有年份的列按排班周期推断年份），
                // 主页按完整日期查询，不同年份同月同日不再串
                finalData = DC.normalizeShiftRows(finalData).rows;

                importedData = finalData;
                renderTable(finalData);
                DC.showNotification('✅ 成功解析 ' + finalData.length + ' 条（检测到 ' + dateColCount + ' 个日期列）', 'success');
                fileInput.value = '';

            } catch(err) {
                var errMsg = err.message || '未知错误';
                if (errMsg.indexOf('Workbook') >= 0) {
                    DC.showNotification('❌ 不是有效的 Excel 文件', 'error');
                } else {
                    DC.showNotification('❌ 文件解析失败：' + errMsg, 'error');
                }
            }
        };

        reader.onerror = function() {
            DC.showNotification('❌ 文件读取失败，请重试', 'error');
        };

        // Excel 解析库是按需加载的：网络慢时先等库就绪再解析
        DC.ensureXlsx().then(function () { reader.readAsArrayBuffer(file); }, function () {
            DC.showNotification('❌ Excel 解析库加载失败，请检查网络后重试', 'error');
        });
    }

    function doImport() {
        try {
            // 与已导入的班表合并：同一个人按日期合并（同一天以本次为准），其他周期的数据保留
            var oldRows = [];
            try { oldRows = JSON.parse(localStorage.getItem('importedShiftData') || '[]'); } catch (e) { oldRows = []; }
            if (!Array.isArray(oldRows)) oldRows = [];
            oldRows = DC.normalizeShiftRows(oldRows).rows;
            var merged = DC.mergeShiftRows(oldRows, importedData);
            localStorage.setItem('importedShiftData', JSON.stringify(merged));
            var rg = DC.shiftDateRange(importedData), all = DC.shiftDateRange(merged);
            DC.showNotification('✅ 导入完成：本次 ' + importedData.length + ' 行' +
                (rg ? '（' + rg.from + ' ~ ' + rg.to + '）' : '') +
                (oldRows.length ? '，已与原有班表合并' + (all ? '，现有数据 ' + all.from + ' ~ ' + all.to : '') : ''), 'success');
            // 完整重置上传区域状态，为下次上传做好准备
            setTimeout(function() {
                var ts = document.getElementById('table-section');
                var bi = document.getElementById('btn-import');
                if (ts) ts.classList.remove('visible');
                if (bi) bi.style.display = 'none';
                importedData = [];
                // 重置表格内容
                var head = document.getElementById('table-head');
                var body = document.getElementById('table-body');
                if (head) head.innerHTML = '';
                if (body) body.innerHTML = '';
                var rc = document.getElementById('row-count');
                if (rc) rc.textContent = '0 条';
            }, 1200);
        } catch(err) {
            if (err.name === 'QuotaExceededError' || err.code === 22) {
                DC.showNotification('❌ 数据过大，超出浏览器存储限制（约 5MB）', 'error');
            } else {
                DC.showNotification('❌ 导入失败：' + (err.message || '未知错误'), 'error');
            }
        }
    }
</script>
</body>
</html>
