<div data-omega-watermark data-omega-edit-ui style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483100;padding:4px 10px;font-family:inherit;font-size:11px;line-height:1;color:inherit;opacity:.4;letter-spacing:.5px;pointer-events:none;user-select:none;-webkit-user-select:none;">狍子AI · Omega 引擎生成</div>

<div class="container">
    <div class="notification" id="notification"></div>

    <div class="page-intro">
        <h2>📥 数据导入</h2>
        <p>上传班表即可在主页展示</p>
    </div>

    <div class="upload-section">
        <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.txt" />
            <div class="upload-icon">📥</div>
            <div class="upload-text">点击或拖拽文件到此处上传</div>
            <div class="upload-hint">支持 .csv / .xlsx / .xls / .txt 格式</div>
        </div>
    </div>

    <div class="table-section" id="table-section">
        <div class="section-title">
            📋 数据预览
            <span class="count" id="row-count">0 条</span>
        </div>
        <table id="data-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="action-bar">
        <button class="btn btn-import" id="btn-import" style="display:none;" onclick="doImport()">开始导入</button>
    </div>
</div>

<script>
    var zone = document.getElementById('upload-zone');
    var fileInput = document.getElementById('file-input');
    var importedData = [];

    // 全局阻止浏览器默认拖放行为（否则文件会被直接下载）
    document.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.addEventListener('drop', function(e) { e.preventDefault(); });

    // 仅在上传区域内处理文件拖放
    zone.addEventListener('dragover', function(e) {
        e.preventDefault();
        zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', function(e) {
        // 只有真正离开区域时才移除高亮
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', function(e) {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', function() {
        if (this.files.length) handleFile(this.files[0]);
    });

    function renderTable(data) {
        var head = document.getElementById('table-head');
        var body = document.getElementById('table-body');
        if (!data.length) return;
        var keys = Object.keys(data[0]);
        head.innerHTML = '';
        var tr = document.createElement('tr');
        keys.forEach(function(k) {
            var th = document.createElement('th');
            th.textContent = k;
            tr.appendChild(th);
        });
        head.appendChild(tr);
        body.innerHTML = '';
        data.forEach(function(row) {
            var tr = document.createElement('tr');
            keys.forEach(function(k) {
                var v = row[k];
                if (v === null || v === undefined) v = '';
                else if (typeof v === 'object') { try { v = JSON.stringify(v); } catch(ex) { v = String(v); } }
                else v = String(v);
                var td = document.createElement('td');
                td.textContent = v;
                td.title = v;
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
        document.getElementById('table-section').classList.add('visible');
        document.getElementById('btn-import').style.display = 'inline-block';
        document.getElementById('row-count').textContent = data.length + ' 条';
    }

    var MAX_FILE_SIZE = 10 * 1024 * 1024;

    function handleFile(file) {
        var ext = file.name.split('.').pop().toLowerCase();
        if (!['csv','xlsx','xls','txt'].includes(ext)) {
            DC.showNotification('❌ 请上传 CSV / Excel 文件', 'error'); return;
        }
        if (file.size > MAX_FILE_SIZE) {
            DC.showNotification('❌ 文件过大（最大 10MB）', 'error'); return;
        }

        var reader = new FileReader();
        DC.showNotification('⏳ 正在解析文件...', 'info');

        reader.onload = function(e) {
            try {
                var workbook;

                // ✅ 修复 Bug 2：CSV/TXT 用字符串解析，Excel 用 ArrayBuffer
                // 注意：不能用 raw:true，否则日期列会变成 Excel 序号数字而非日期字符串
                if (ext === 'csv' || ext === 'txt') {
                    workbook = XLSX.read(e.target.result, { type: 'string' });
                } else {
                    var data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }

                var sheetName = workbook.SheetNames[0];
                var sheet = workbook.Sheets[sheetName];

                // 处理合并单元格：把合并区域的值填充到所有单元格
                if (sheet['!merges']) {
                    sheet['!merges'].forEach(function(m) {
                        var addr = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
                        var val = sheet[addr] ? sheet[addr].v : '';
                        for (var r = m.s.r; r <= m.e.r; r++) {
                            for (var c = m.s.c; c <= m.e.c; c++) {
                                var a = XLSX.utils.encode_cell({ r: r, c: c });
                                if (!sheet[a]) sheet[a] = { t: 's', v: val };
                                else if (r === m.s.r && c === m.s.c) continue;
                                else sheet[a].v = val;
                            }
                        }
                    });
                }

                var jsonData = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });

                // 尝试解析嵌套 JSON 字段
                jsonData = jsonData.map(function(row) {
                    Object.keys(row).forEach(function(key) {
                        if (typeof row[key] === 'string') {
                            var s = row[key].trim();
                            if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
                                try { row[key] = JSON.parse(s); } catch(ex) {}
                            }
                        }
                    });
                    return row;
                });

                if (!jsonData || !jsonData.length) {
                    DC.showNotification('❌ 文件内容为空', 'error'); return;
                }

                // ═══ 核心处理：班表格式 ═══
                var dateRow = jsonData[0];

                // 建立 列key → 日期字符串 的映射
                // 兼容多种日期格式：X月X日、ISO日期(YYYY-MM-DD)、Excel日期串等
                var colKeyToDate = {};
                var allKeys = Object.keys(dateRow);
                var datePatterns = [
                    /\d+\s*月\s*\d+\s*[日号]/,           // 6月3日 / 6月3号 / 6 月 3 日
                    /\d{1,2}[\/\-\.]\d{1,2}/,            // 6/3 / 6-3 / 6.3
                    /\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2}/ // 2024/6/3 / 2024-06-21（含时间后缀也匹配）
                ];
                function looksLikeDate(val) {
                    if (!val && val !== 0) return false;
                    // ✅ Date 对象直接识别为日期（Excel 原生日期单元格）
                    if (val instanceof Date && !isNaN(val)) return true;
                    var s = String(val).trim();
                    for (var pi = 0; pi < datePatterns.length; pi++) {
                        if (datePatterns[pi].test(s)) return true;
                    }
                    return false;
                }
                for (var di = 0; di < allKeys.length; di++) {
                    var dk = allKeys[di];
                    var rawVal = dateRow[dk];

                    // ✅ 修复核心 Bug（上传即报错）：当 Excel 表头单元格本身被设置为
                    // 「日期」格式时（例如班表首行从第4列起就是日期单元格，显示为"6月21日"），
                    // sheet_to_json 会直接把格式化后的日期文本当作列名（key）使用，
                    // 日期信息出现在 key 上而不会出现在下一行的取值(rawVal)里，
                    // 导致原逻辑永远检测不到日期列，从而误报"未检测到日期列"并中断上传。
                    // 因此这里优先检查列名本身是否为日期格式。
                    if (looksLikeDate(dk)) {
                        colKeyToDate[dk] = String(dk).trim();
                        continue;
                    }

                    if (!looksLikeDate(rawVal)) continue;
                    // 格式化日期值：Date对象→YYYY-MM-DD，字符串则清理时间后缀
                    var dVal;
                    if (rawVal instanceof Date) {
                        var m = rawVal.getMonth() + 1;
                        var d = rawVal.getDate();
                        dVal = rawVal.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
                    } else {
                        dVal = String(rawVal).trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\.\d+)?$/, '').replace(/T\d{2}:\d{2}(:\d{2})?(\.\d+)?Z?$/, '');
                    }
                    colKeyToDate[dk] = dVal;
                }

                // ✅ 修复 Bug 6：数据校验 — 没有日期列说明不是班表
                var dateColCount = Object.keys(colKeyToDate).length;
                if (dateColCount === 0) {
                    DC.showNotification('❌ 未检测到日期列（X月X日），请确认上传的是班表文件', 'error'); return;
                }

                // 智能姓名列识别：按行0的值内容匹配，不依赖 _1/_2 等硬编码 key
                // 兼容合并表头退化为 "排班原则..._1" / "__EMPTY" 等各种情况
                var NAME_COL_MAP = [
                    { hints: ['英文名','英文','English'], target: '英文名' },
                    { hints: ['中文名','中文','Chinese','企业名'], target: '中文名' },
                    { hints: ['企业名','公司','Company'],   target: '企业名' }
                ];
                for (var ni = 0; ni < allKeys.length; ni++) {
                    var nk = allKeys[ni];
                    if (colKeyToDate[nk]) continue; // 已映射（日期列）跳过
                    var nVal = String(dateRow[nk] || '').trim();
                    if (!nVal) continue;
                    for (var nh = 0; nh < NAME_COL_MAP.length; nh++) {
                        var group = NAME_COL_MAP[nh];
                        for (var hi = 0; hi < group.hints.length; hi++) {
                            // 同时检查 key 名和行0值，覆盖两种情况
                            if (nVal.indexOf(group.hints[hi]) >= 0 || nk.indexOf(group.hints[hi]) >= 0) {
                                colKeyToDate[nk] = group.target;
                                break;
                            }
                        }
                        if (colKeyToDate[nk]) break;
                    }
                }

                var dataRows = jsonData.slice(1);

                // 过滤备注行（用已建立的 colKeyToDate 找姓名列）
                var cleanRows = [];
                // 找到映射为"英文名"/含英文的原始key
                var engRawKey = null;
                for (var mk in colKeyToDate) {
                    if (colKeyToDate[mk] === '英文名' || mk.indexOf('英文') >= 0) { engRawKey = mk; break; }
                }
                for (var ci = 0; ci < dataRows.length; ci++) {
                    var row = dataRows[ci];
                    var firstNameVal = '';
                    if (engRawKey) firstNameVal = String(row[engRawKey] || '').trim();
                    if (!firstNameVal) {
                        // fallback：遍历所有key找第一个看起来像名字的列
                        for (var fk in row) {
                            if (fk === '_1' || fk === '__EMPTY_1' || fk.indexOf('英文') >= 0 || colKeyToDate[fk] === '英文名') {
                                firstNameVal = String(row[fk] || '').trim(); break;
                            }
                        }
                    }
                    if (firstNameVal && firstNameVal.indexOf('备注') >= 0) continue;
                    cleanRows.push(row);
                }

                // 替换 key
                var finalData = cleanRows.map(function(row) {
                    var newRow = {};
                    for (var k in row) {
                        var newKey = colKeyToDate[k] || k;
                        newRow[newKey] = row[k];
                    }
                    return newRow;
                });

                importedData = finalData;
                renderTable(finalData);
                DC.showNotification('✅ 成功解析 ' + finalData.length + ' 条（检测到 ' + dateColCount + ' 个日期列）', 'success');
                fileInput.value = '';

            } catch(err) {
                var errMsg = err.message || '未知错误';
                if (errMsg.indexOf('Workbook') >= 0) {
                    DC.showNotification('❌ 不是有效的 Excel 文件', 'error');
                } else {
                    DC.showNotification('❌ 文件解析失败：' + errMsg, 'error');
                }
            }
        };

        reader.onerror = function() {
            DC.showNotification('❌ 文件读取失败，请重试', 'error');
        };

        if (ext === 'csv' || ext === 'txt') { reader.readAsText(file); }
        else { reader.readAsArrayBuffer(file); }
    }

    function doImport() {
        try {
            localStorage.setItem('importedShiftData', JSON.stringify(importedData));
            DC.showNotification('✅ 导入完成！共 ' + importedData.length + ' 条数据（将在主页展示）', 'success');
            // 完整重置上传区域状态，为下次上传做好准备
            setTimeout(function() {
                var ts = document.getElementById('table-section');
                var bi = document.getElementById('btn-import');
                if (ts) ts.classList.remove('visible');
                if (bi) bi.style.display = 'none';
                importedData = [];
                // 重置表格内容
                var head = document.getElementById('table-head');
                var body = document.getElementById('table-body');
                if (head) head.innerHTML = '';
                if (body) body.innerHTML = '';
                var rc = document.getElementById('row-count');
                if (rc) rc.textContent = '0 条';
            }, 1200);
        } catch(err) {
            if (err.name === 'QuotaExceededError' || err.code === 22) {
                DC.showNotification('❌ 数据过大，超出浏览器存储限制（约 5MB）', 'error');
            } else {
                DC.showNotification('❌ 导入失败：' + (err.message || '未知错误'), 'error');
            }
        }
    }
</script>

<script data-omega-edit-layer>
(function(){
  var W=window;var NS=W.__OMEGA__=W.__OMEGA__||{};
  if(NS.__editLayerReady)return;NS.__editLayerReady=true;
  // 不可改字的标签（媒体/脚本/表单控件/矢量）：这些没有「直接可读文本」语义,或编辑会破坏结构。
  var SKIP_TAGS={SCRIPT:1,STYLE:1,NOSCRIPT:1,SVG:1,CANVAS:1,IMG:1,IFRAME:1,VIDEO:1,AUDIO:1,SELECT:1,TEXTAREA:1,INPUT:1,BR:1,HR:1};
  // 元素是否拥有「直接文本节点」（非空白）。这是「全部文字可改」的核心判据——
  // 不再靠标签白名单（div/section 里的正文同样命中），与 frontend-slides 一致。
  function hasOwnText(el){
    var ns=el.childNodes;
    for(var i=0;i<ns.length;i++){var c=ns[i];if(c.nodeType===3&&c.nodeValue&&c.nodeValue.replace(/\s+/g,'').length)return true;}
    return false;
  }
  var editing=false,hideTimer=null;
  var hot=document.createElement('div');hot.className='omega-edit-hotzone';hot.setAttribute('data-omega-edit-ui','');document.body.appendChild(hot);
  var toggle=document.createElement('button');toggle.className='omega-edit-toggle';toggle.textContent='\u270e';toggle.title='编辑 (E)';toggle.setAttribute('data-omega-edit-ui','');document.body.appendChild(toggle);
  var flash=document.createElement('div');flash.className='omega-edit-flash';flash.setAttribute('data-omega-edit-ui','');document.body.appendChild(flash);
  function showToggle(){if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}toggle.classList.add('is-visible');}
  // 用 JS + 400ms 宽限,不用 CSS ~ 兄弟选择器:按钮 pointer-events 会断 hover 链。
  function scheduleHide(){if(editing)return;hideTimer=setTimeout(function(){toggle.classList.remove('is-visible');},400);}
  hot.addEventListener('mouseenter',showToggle);hot.addEventListener('mouseleave',scheduleHide);
  toggle.addEventListener('mouseenter',showToggle);toggle.addEventListener('mouseleave',scheduleHide);
  function setEditable(on){editing=on;NS.editing=on;toggle.classList.toggle('is-editing',on);document.body.classList.toggle('omega-editing',on);if(on){showToggle();}else{scheduleHide();}
    if(!on){Array.prototype.forEach.call(document.body.querySelectorAll('[contenteditable="true"]'),function(el){el.removeAttribute('contenteditable');});return;}
    var els=document.body.querySelectorAll('*');
    Array.prototype.forEach.call(els,function(el){
      if(SKIP_TAGS[el.tagName])return;
      if(el.closest('[data-omega-edit-ui]'))return;
      if(el.closest('svg'))return;
      // 动态区(运行时数据驱动的图表/数字:data-query-id;或显式标注 data-omega-dynamic)不可内联改字——
      // 「改了白改」(下次查询刷回),且改后无法回写到数据源。编辑态仅给视觉提示(见 .omega-editing 样式)。
      if(el.closest('[data-omega-dynamic],[data-query-id]'))return;
      // 自身无直接文本 → 跳过(纯布局容器,其文本子节点会各自命中)。
      if(!hasOwnText(el))return;
      // 祖先已可编辑 → 跳过:contenteditable 向下级联,避免重复虚线框与嵌套编辑冲突。
      // 文档序遍历保证祖先先于后代被标记,故只需看 parentElement.closest。
      if(el.parentElement&&el.parentElement.closest('[contenteditable="true"]'))return;
      el.setAttribute('contenteditable','true');});}
  function flashMsg(t){flash.textContent=t;flash.classList.add('is-show');setTimeout(function(){flash.classList.remove('is-show');},1200);}
  NS.flashMsg=flashMsg;
  // 序列化整份文档:剥编辑态 + 删运行期 UI + deck 还原钩子。回写唯一真相源 = HTML。
  function serialize(){
    var root=document.documentElement.cloneNode(true);
    Array.prototype.forEach.call(root.querySelectorAll('[data-omega-edit-ui]'),function(e){if(e.parentNode)e.parentNode.removeChild(e);});
    Array.prototype.forEach.call(root.querySelectorAll('[contenteditable]'),function(e){e.removeAttribute('contenteditable');});
    // 动态数据容器(data-query-id)清空已渲染图表 DOM(echarts canvas 等):重载时 loadData() 会重新渲染。
    // 否则冻结的图表 DOM 会让二次 echarts.init 在同一容器叠加/损坏(重载双重渲染)。仅改克隆,不动 live 文档。
    Array.prototype.forEach.call(root.querySelectorAll('[data-query-id]'),function(e){e.innerHTML='';});
    Array.prototype.forEach.call(root.querySelectorAll('.omega-editing'),function(e){e.classList.remove('omega-editing');});
    if(typeof NS.normalizeSerializedRoot==='function'){try{NS.normalizeSerializedRoot(root);}catch(_e){}}
    return '<!DOCTYPE html>\n'+root.outerHTML;
  }
  function save(){
    var html=serialize();
    if(W.parent&&W.parent!==W){try{W.parent.postMessage({type:'omega:artifact-edit',html:html},'*');}catch(_e){}flashMsg('已保存');return;}
    try{var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=(document.title||'omega')+'.html';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);flashMsg('已下载');}catch(_e){flashMsg('保存失败');}
  }
  NS.save=save;
  toggle.addEventListener('click',function(){setEditable(!editing);});
  window.addEventListener('keydown',function(e){
    var t=e.target||{};var tag=(t.tagName||'').toUpperCase();
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();save();return;}
    if(t.isContentEditable||tag==='INPUT'||tag==='TEXTAREA')return;
    if(e.key==='e'||e.key==='E'){setEditable(!editing);}
  });
})();
</script>
</body>
</html>
